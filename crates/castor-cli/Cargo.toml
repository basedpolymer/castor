[package]
name = "castor-cli"
description = "Castor from the terminal: every tool, scriptable (library + development binary)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "castor-cli"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
castor-core.workspace = true
castor-tools.workspace = true
castor-mcp = { path = "../castor-mcp" }
tracing-subscriber.workspace = true
clap = { version = "4", features = ["derive"] }
ctrlc = "3"

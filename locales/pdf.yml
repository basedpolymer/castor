  fr: "Copier les pages choisies dans un nouveau PDF."
  de: "Ausgewählte Seiten in eine neue PDF-Datei kopieren."
  es: "Copia las páginas elegidas en un PDF nuevo."
  it: "Copia le pagine scelte in un nuovo PDF."
  pt-BR: "Copia as páginas escolhidas para um novo PDF."
  ja: "選んだページを新しいPDFにコピーします。"
  zh-CN: "将所选页面复制到新的 PDF。"
  ko: "선택한 페이지를 새 PDF로 복사합니다."

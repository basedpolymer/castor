  it: "Scansione in PDF"
  pt-BR: "Digitalização para PDF"
  ja: "スキャンをPDFに変換"
  zh-CN: "扫描转 PDF"
  ko: "스캔을 PDF로"
image.to-pdf.desc:
  en: "Turn a photo of a page into a clean, searchable PDF."
  fr: "Transformer la photo d’une page en PDF propre et consultable."
  de: "Aus dem Foto einer Seite eine saubere, durchsuchbare PDF-Datei machen."
  es: "Convierte la foto de una página en un PDF limpio y con texto buscable."
  it: "Trasforma la foto di una pagina in un PDF pulito e ricercabile."
  pt-BR: "Transforma a foto de uma página em um PDF limpo e pesquisável."
  ja: "ページを撮影した写真を、きれいで検索可能なPDFにします。"
  zh-CN: "将页面照片变成整洁、可搜索的 PDF。"
  ko: "페이지를 찍은 사진을 깔끔하고 검색 가능한 PDF로 만듭니다."

  it: "Inserisci le pagine da estrarre, ad es. 1-3, 7."
  pt-BR: "Digite as páginas a extrair, por exemplo 1-3, 7."
  ja: "抽出するページを入力してください（例：1-3, 7）。"
  zh-CN: "请输入要提取的页面，例如 1-3, 7。"
  ko: "추출할 페이지를 입력하세요(예: 1-3, 7)."

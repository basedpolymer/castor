pdf.compress.opt.preset.help:
  en: "Light only cleans up the file. Balanced resamples photos to 150 dpi. Strong goes to 120 dpi. Maximum goes to 96 dpi, converts CMYK to RGB and drops tags."
  fr: "Léger nettoie seulement le fichier. Équilibré ramène les photos à 150 dpi. Fort descend à 120 dpi. Maximum descend à 96 dpi, convertit le CMJN en RVB et retire le balisage."
  de: "„Leicht“ räumt nur die Datei auf. „Ausgewogen“ rechnet Fotos auf 150 dpi herunter. „Stark“ geht auf 120 dpi. „Maximal“ geht auf 96 dpi, wandelt CMYK in RGB um und entfernt Tags."
  es: "Ligera solo limpia el archivo. Equilibrada reduce las fotos a 150 dpi. Fuerte baja a 120 dpi. Máxima baja a 96 dpi, convierte CMYK a RGB y elimina las etiquetas."
  it: "Leggera si limita a ripulire il file. Bilanciata ricampiona le foto a 150 dpi. Forte scende a 120 dpi. Massima scende a 96 dpi, converte CMYK in RGB ed elimina i tag."
  pt-BR: "Leve apenas limpa o arquivo. Equilibrada reamostra as fotos para 150 dpi. Forte vai a 120 dpi. Máxima vai a 96 dpi, converte CMYK em RGB e remove as tags."
  ja: "「軽め」はファイルの整理のみ行います。「標準」は写真を150 dpiに再サンプリングし、「強め」は120 dpi、「最大」は96 dpiにして、CMYKをRGBに変換しタグも削除します。"
  zh-CN: "“轻度”只清理文件。“均衡”将照片重采样为 150 dpi。“强力”降至 120 dpi。“最大”降至 96 dpi，并将 CMYK 转换为 RGB、移除标签。"
  ko: "가벼움은 파일만 정리합니다. 균형은 사진을 150 dpi로, 강함은 120 dpi로 다시 샘플링합니다. 최대는 96 dpi로 낮추고 CMYK를 RGB로 변환하며 태그를 제거합니다."

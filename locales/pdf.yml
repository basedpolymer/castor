  es: "No se pudo abrir este archivo como documento. Puede estar dañado o no ser un PDF real: prueba con Reparar PDF."
  it: "Impossibile aprire questo file come documento. Potrebbe essere danneggiato o non essere un vero PDF: prova con Ripara PDF."
  pt-BR: "Não foi possível abrir este arquivo como documento. Ele pode estar danificado ou não ser um PDF de verdade — tente Reparar PDF."
  ja: "このファイルをドキュメントとして開けませんでした。破損しているか、本物のPDFではない可能性があります。「PDFを修復」をお試しください。"

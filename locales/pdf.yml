  de: "Latin Modern und TeX Gyre Chorus sind eingebettet; die anderen sind die PDF-Standardschriften."
  es: "Latin Modern y TeX Gyre Chorus van incrustadas; las demás son las fuentes estándar de PDF."
  it: "Latin Modern e TeX Gyre Chorus sono incorporati; gli altri sono i font standard del PDF."
  pt-BR: "Latin Modern e TeX Gyre Chorus são incorporadas; as outras são as fontes padrão do PDF."

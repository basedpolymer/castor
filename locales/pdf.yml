image.images-to-pdf.opt.page_size.help:
  en: "JPEG photos are embedded as they are, without re-compression."
  fr: "Les photos JPEG sont incorporées telles quelles, sans recompression."
  de: "JPEG-Fotos werden unverändert eingebettet, ohne erneute Komprimierung."
  es: "Las fotos JPEG se incrustan tal cual, sin recomprimir."
  it: "Le foto JPEG vengono incorporate così come sono, senza ricomprimerle."
  pt-BR: "As fotos JPEG são incorporadas como estão, sem recompressão."
  ja: "JPEG写真は再圧縮せず、そのまま埋め込まれます。"
  zh-CN: "JPEG 照片会原样嵌入，不会重新压缩。"
  ko: "JPEG 사진은 다시 압축하지 않고 그대로 포함됩니다."

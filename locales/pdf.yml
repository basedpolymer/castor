pdf.extract-pages.opt.password.help:
  en: "Only needed if the input is protected. Never stored."
  fr: "Seulement si le fichier est protégé. Jamais enregistré."
  de: "Nur nötig, wenn die Eingabe geschützt ist. Wird nie gespeichert."
  es: "Solo es necesaria si el archivo está protegido. Nunca se guarda."
  it: "Serve solo se il file è protetto. Non viene mai memorizzata."
  pt-BR: "Necessária apenas se o arquivo for protegido. Nunca é armazenada."
  ja: "入力ファイルが保護されている場合のみ必要です。保存されません。"
  zh-CN: "仅在输入文件受保护时需要。绝不会被保存。"
  ko: "입력 파일이 보호된 경우에만 필요합니다. 저장되지 않습니다."
pdf.extract-pages.err.empty:
  en: "Enter the pages to extract, e.g. 1-3, 7."
  fr: "Indiquez les pages à extraire, par ex. 1-3, 7."
  de: "Geben Sie die zu extrahierenden Seiten ein, z. B. 1-3, 7."

  fr: "Fichier de données"
pdf.fill-form.opt.data.help:
  en: "CSV/TSV with field names in the first row (one PDF per row), or JSON."
  fr: "CSV/TSV avec les noms de champs en première ligne (un PDF par ligne), ou JSON."
pdf.fill-form.opt.values:
  en: "Values"
  fr: "Valeurs"
pdf.fill-form.opt.values.help:
  en: "One per line: field name = value. Checkboxes take yes / no."
  fr: "Une par ligne : nom du champ = valeur. Les cases à cocher prennent oui / non."
pdf.fill-form.opt.name_field:
  en: "Name files after column"
  fr: "Nommer les fichiers d’après la colonne"
pdf.fill-form.opt.flatten:
  en: "Flatten after filling"
  fr: "Aplatir après remplissage"
pdf.fill-form.opt.password:
  en: "Password"
  fr: "Mot de passe"
pdf.fill-form.opt.password.help:
  en: "Only needed if the input is protected. Never stored."
  fr: "Seulement si le fichier est protégé. Jamais enregistré."
pdf.fill-form.err.json:
  en: "The JSON must be an object or a list of objects."
  fr: "Le JSON doit être un objet ou une liste d’objets."
pdf.fill-form.err.csv:
  en: "The CSV needs a header row and at least one data row."
  fr: "Le CSV doit avoir une ligne d’en-tête et au moins une ligne de données."
pdf.fill-form.err.no_data:
  en: "Choose a data file or type some values."
  fr: "Choisissez un fichier de données ou saisissez des valeurs."
pdf.fill-form.err.no_fields:
  en: "This PDF has no form fields."
  fr: "Ce PDF n’a pas de champs de formulaire."
pdf.fill-form.note.list:
  en: "%{count} fields"
  fr: "%{count} champs"
pdf.fill-form.note.fill:
  en: "%{count} fields filled"
  fr: "%{count} champs remplis"
pdf.fill-form.note.missing:
  en: "not found: %{names}"
  fr: "introuvables : %{names}"

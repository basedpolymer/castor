  ko: "데이터 병합"
create.data-merge.desc:
  en: A spreadsheet and a layout become certificates, badges, labels or letters — one PDF per row or all in one.
  fr: Un tableur et une mise en page deviennent certificats, badges, étiquettes ou lettres — un PDF par ligne ou tout en un.
  de: "Aus einer Tabelle und einem Layout werden Urkunden, Namensschilder, Etiketten oder Briefe – ein PDF pro Zeile oder alles in einem."
  es: "Una hoja de cálculo y un diseño se convierten en certificados, acreditaciones, etiquetas o cartas: un PDF por fila o todo en uno."
  it: "Un foglio di calcolo e un layout diventano attestati, badge, etichette o lettere: un PDF per riga o tutto in uno."
  pt-BR: "Uma planilha e um layout viram certificados, crachás, etiquetas ou cartas: um PDF por linha ou tudo em um."
  ja: "表計算データとレイアウトから、賞状・名札・ラベル・手紙を作成。1 行ごとの PDF にも、1 つの PDF にもまとめられます。"
  zh-CN: "用表格和版式生成证书、胸牌、标签或信函，每行一个 PDF 或合并为一个。"
  ko: "스프레드시트와 레이아웃으로 증서, 명찰, 라벨, 편지를 만듭니다. 행마다 PDF 하나씩 또는 하나로 합쳐서 만들 수 있습니다."

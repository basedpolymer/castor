create.carousel.desc:
  en: Multi-slide social carousels from a few text blocks and images, in one consistent template.
  fr: Des carrousels de plusieurs diapositives à partir de quelques textes et images, dans un modèle cohérent.
  de: "Mehrteilige Social-Karussells aus wenigen Textblöcken und Bildern – in einer einheitlichen Vorlage."
  es: "Carruseles para redes sociales con varias diapositivas a partir de unos bloques de texto e imágenes, en una plantilla coherente."
  it: "Caroselli social a più slide da pochi blocchi di testo e immagini, in un unico modello coerente."
  pt-BR: "Carrosséis para redes sociais com vários slides a partir de alguns blocos de texto e imagens, em um modelo consistente."
  ja: "数個のテキストと画像から、統一テンプレートで複数スライドの SNS カルーセルを作成します。"
  zh-CN: "用几段文字和图片，按统一模板生成多页社交媒体轮播图。"
  ko: "몇 개의 텍스트와 이미지로 일관된 템플릿의 여러 장짜리 소셜 캐러셀을 만듭니다."

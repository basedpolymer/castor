  it: "motivo texture senza giunture tassello sfondo pois righe terrazzo geometrico ripetere"
  pt-BR: "padrão textura contínuo ladrilho fundo bolinhas listras terrazzo geométrico repetir"
  ja: "パターン テクスチャ シームレス タイル 背景 水玉 ストライプ テラゾー 幾何学 繰り返し"
  zh-CN: "图案 纹理 无缝 拼贴 背景 圆点 条纹 水磨石 几何 重复"
  ko: "패턴 텍스처 이음새 없는 타일 배경 물방울 줄무늬 테라조 기하학 반복"

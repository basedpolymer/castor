create.carousel.opt.slides.help:
  en: "Separate slides with a line of three dashes (---). First line = title, the rest = text. Dropped images go to slides 1, 2, 3… in order."
  fr: "Séparez les diapositives par une ligne de trois tirets (---). Première ligne = titre, le reste = texte. Les images déposées vont aux diapositives 1, 2, 3… dans l’ordre."
  de: "Trennen Sie Slides durch eine Zeile mit drei Strichen (---). Erste Zeile = Titel, der Rest = Text. Abgelegte Bilder gehen der Reihe nach an Slide 1, 2, 3 …"
  es: "Separa las diapositivas con una línea de tres guiones (---). Primera línea = título, el resto = texto. Las imágenes soltadas van a las diapositivas 1, 2, 3… en orden."
  it: "Separa le slide con una riga di tre trattini (---). Prima riga = titolo, il resto = testo. Le immagini trascinate vanno alle slide 1, 2, 3… in ordine."
  pt-BR: "Separe os slides com uma linha de três hifens (---). Primeira linha = título, o resto = texto. As imagens soltas vão para os slides 1, 2, 3… em ordem."
  ja: "スライドは 3 つのハイフン (---) だけの行で区切ります。1 行目がタイトル、残りが本文です。ドロップした画像は順にスライド 1、2、3… に入ります。"
  zh-CN: "用只含三个连字符 (---) 的一行分隔幻灯片。第一行为标题，其余为正文。拖入的图片会依次放入第 1、2、3…张幻灯片。"
  ko: "슬라이드는 하이픈 세 개(---)만 있는 줄로 구분합니다. 첫 줄은 제목, 나머지는 본문입니다. 끌어다 놓은 이미지는 슬라이드 1, 2, 3… 순서로 들어갑니다."

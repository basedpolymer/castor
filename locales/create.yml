create.pattern.name:
  en: Pattern & texture
  fr: Motifs et textures
  de: "Muster & Textur"
  es: "Patrones y texturas"
  it: "Motivi e texture"
  pt-BR: "Padrões e texturas"
  ja: "パターンとテクスチャ"
  zh-CN: "图案与纹理"
  ko: "패턴 및 텍스처"
create.pattern.desc:
  en: Seamless geometric patterns — diamonds, dots, terrazzo, hexagons… — as a tile or a full background.
  fr: Motifs géométriques sans raccord — losanges, pois, terrazzo, hexagones… — en tuile ou en fond complet.
  de: "Nahtlose geometrische Muster – Rauten, Punkte, Terrazzo, Sechsecke … – als Kachel oder als vollflächiger Hintergrund."
  es: "Patrones geométricos sin costuras (rombos, puntos, terrazo, hexágonos…) como baldosa o como fondo completo."
  it: "Motivi geometrici senza giunture (rombi, pois, terrazzo, esagoni…) come tassello o come sfondo intero."
  pt-BR: "Padrões geométricos contínuos (losangos, bolinhas, terrazzo, hexágonos…) como ladrilho ou fundo completo."
  ja: "ダイヤ、ドット、テラゾー、六角形などの継ぎ目のない幾何学パターンを、タイルまたは全面の背景として作成します。"
  zh-CN: "无缝几何图案（菱形、圆点、水磨石、六边形……），可输出为拼贴单元或整幅背景。"
  ko: "마름모, 점, 테라조, 육각형 등 이음새 없는 기하학 패턴을 타일이나 전체 배경으로 만듭니다."

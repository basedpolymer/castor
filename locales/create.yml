create.shader.desc:
  en: Generative backgrounds — silk, waves, aurora, contour lines — as images or seamless loops.
  fr: Fonds génératifs — soie, vagues, aurore, courbes de niveau — en images ou en boucles parfaites.
  de: "Generative Hintergründe – Seide, Wellen, Polarlicht, Höhenlinien – als Bilder oder nahtlose Schleifen."
  es: "Fondos generativos (seda, olas, aurora, curvas de nivel) como imágenes o bucles sin cortes."
  it: "Sfondi generativi (seta, onde, aurora, curve di livello) come immagini o loop senza stacchi."
  pt-BR: "Fundos generativos (seda, ondas, aurora, curvas de nível) como imagens ou loops contínuos."
  ja: "シルク、波、オーロラ、等高線などのジェネレーティブな背景を、画像またはシームレスなループで作成します。"
  zh-CN: "生成式背景（丝绸、波浪、极光、等高线），可输出图片或无缝循环。"
  ko: "실크, 물결, 오로라, 등고선 같은 생성형 배경을 이미지나 끊김 없는 반복 영상으로 만듭니다."

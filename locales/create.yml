  en: "Enter %{n} digits (check digit added) or %{m} digits."
  fr: "Saisissez %{n} chiffres (clé ajoutée) ou %{m} chiffres."
create.barcode.err.check:
  en: "Wrong check digit: it should be %{digit}."
  fr: "Clé de contrôle erronée : elle devrait être %{digit}."
create.barcode.err.itf_even:
  en: ITF needs an even number of digits.
  fr: L’ITF demande un nombre pair de chiffres.
create.barcode.err.code39:
  en: "Code 39 takes A–Z, 0–9, space and - . $ / + %."
  fr: "Le Code 39 accepte A–Z, 0–9, l’espace et - . $ / + %."
create.barcode.err.codabar:
  en: "Codabar takes digits, - $ : / . + and the start/stop letters A–D."
  fr: "Le Codabar accepte les chiffres, - $ : / . + et les lettres de début/fin A–D."
create.barcode.err.ascii:
  en: Code 128 only encodes plain ASCII characters; use Data Matrix for accents.
  fr: Le Code 128 n’encode que l’ASCII ; utilisez Data Matrix pour les accents.
create.barcode.err.encode:
  en: Could not encode this data
  fr: Impossible d’encoder ces données
create.barcode.err.no_scan:
  en: The barcode could not be read back. Raise the contrast or the height.
  fr: Le code-barres n’a pas pu être relu. Augmentez le contraste ou la hauteur.
create.barcode.err.mismatch:
  en: "The barcode reads back as “%{read}”, not what was asked."
  fr: "Le code-barres se relit « %{read} », pas ce qui était demandé."

create.common.err.size:
  en: "Width and height must be between 16 and 16,384 pixels."
  fr: "La largeur et la hauteur doivent être comprises entre 16 et 16 384 pixels."


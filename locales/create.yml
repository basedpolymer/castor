  de: "qr qrcode code wlan wifi vcard kontakt link url menü scannen karte plakat"
  es: "qr código qr wifi vcard contacto enlace url menú escanear tarjeta cartel"
  it: "qr codice qr wifi vcard contatto link url menu scansionare biglietto poster"
  pt-BR: "qr código qr wifi vcard contato link url cardápio escanear cartão cartaz"
  ja: "qr qrコード wifi vcard 連絡先 リンク url メニュー スキャン カード ポスター"
  zh-CN: "二维码 qr wifi vcard 联系人 链接 网址 菜单 扫描 卡片 海报"
  ko: "qr qr코드 wifi vcard 연락처 링크 url 메뉴 스캔 카드 포스터"

  ko: "아직 인코딩할 내용이 없습니다. 내용을 입력하세요."
create.qr-code.err.too_long:
  en: Too much data for a QR code (about 2,900 characters at most). Shorten it, or use a link.
  fr: Trop de données pour un code QR (environ 2 900 caractères au plus). Raccourcissez, ou utilisez un lien.
  de: "Zu viele Daten für einen QR-Code (höchstens etwa 2.900 Zeichen). Kürzen Sie den Text oder verwenden Sie einen Link."
  es: "Demasiados datos para un código QR (unos 2900 caracteres como máximo). Acórtalo o usa un enlace."
  it: "Troppi dati per un codice QR (circa 2.900 caratteri al massimo). Accorcia il testo o usa un link."
  pt-BR: "Dados demais para um código QR (cerca de 2.900 caracteres no máximo). Encurte ou use um link."
  ja: "QR コードに収めるにはデータが多すぎます (最大約 2,900 文字)。短くするか、リンクを使ってください。"
  zh-CN: "数据量超出二维码容量（最多约 2,900 个字符）。请缩短内容，或改用链接。"
  ko: "QR 코드에 담기에는 데이터가 너무 많습니다(최대 약 2,900자). 줄이거나 링크를 사용하세요."

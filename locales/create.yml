create.favicon.desc:
  en: A complete favicon pack — ICO, SVG, Apple and Android icons, manifest — from a letter, an emoji or a logo.
  fr: Un jeu de favicons complet — ICO, SVG, icônes Apple et Android, manifeste — à partir d’une lettre, d’un emoji ou d’un logo.
  de: "Ein komplettes Favicon-Paket – ICO, SVG, Apple- und Android-Icons, Manifest – aus Buchstabe, Emoji oder Logo."
  es: "Un paquete completo de favicons (ICO, SVG, iconos de Apple y Android, manifiesto) a partir de una letra, un emoji o un logotipo."
  it: "Un pacchetto completo di favicon (ICO, SVG, icone Apple e Android, manifest) da una lettera, un emoji o un logo."
  pt-BR: "Um pacote completo de favicons (ICO, SVG, ícones Apple e Android, manifesto) a partir de uma letra, um emoji ou um logotipo."
  ja: "文字、絵文字、ロゴから、ICO・SVG・Apple/Android アイコン・マニフェストまで揃ったファビコン一式を作成します。"
  zh-CN: "用一个字母、表情符号或徽标生成完整的网站图标包：ICO、SVG、Apple 和 Android 图标以及清单文件。"
  ko: "글자, 이모지 또는 로고로 ICO, SVG, Apple·Android 아이콘, 매니페스트까지 갖춘 파비콘 세트를 만듭니다."

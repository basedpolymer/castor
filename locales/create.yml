# ------------------------------------------------------------------ QR code
create.qr-code.name:
  en: QR code
  fr: Code QR
  de: "QR-Code"
  es: "Código QR"
  it: "Codice QR"
  pt-BR: "Código QR"
  ja: "QR コード"
  zh-CN: "二维码"
  ko: "QR 코드"
create.qr-code.desc:
  en: Links, Wi-Fi, contacts and events as stylish QR codes and printable cards — always checked to scan.
  fr: Liens, Wi-Fi, contacts et événements en codes QR soignés et cartes à imprimer — toujours vérifiés au scan.
  de: "Links, WLAN, Kontakte und Termine als schicke QR-Codes und druckfertige Karten – immer auf Scanbarkeit geprüft."
  es: "Enlaces, Wi-Fi, contactos y eventos como códigos QR con estilo y tarjetas imprimibles, siempre comprobados para que se escaneen."
  it: "Link, Wi-Fi, contatti ed eventi come eleganti codici QR e biglietti stampabili, sempre verificati per la scansione."
  pt-BR: "Links, Wi-Fi, contatos e eventos como códigos QR elegantes e cartões imprimíveis, sempre testados para escanear."
  ja: "リンク、Wi-Fi、連絡先、イベントをおしゃれな QR コードや印刷用カードに。読み取りは常に確認済みです。"
  zh-CN: "把链接、Wi-Fi、联系人和活动做成精美的二维码和可打印卡片，并始终验证可扫描。"
  ko: "링크, Wi-Fi, 연락처, 일정을 멋진 QR 코드와 인쇄용 카드로 만듭니다. 스캔 여부를 항상 확인합니다."
create.qr-code.verb:
  en: Create QR code
  fr: Créer le code QR
  de: "QR-Code erstellen"
  es: "Crear código QR"
  it: "Crea codice QR"
  pt-BR: "Criar código QR"
  ja: "QR コードを作成"
  zh-CN: "创建二维码"
  ko: "QR 코드 만들기"

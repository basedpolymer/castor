create.barcode.name:
  en: Barcode
  fr: Code-barres
create.barcode.desc:
  en: EAN, UPC, Code 128, Data Matrix, PDF417 and more, print-ready and checked by a scanner.
  fr: EAN, UPC, Code 128, Data Matrix, PDF417 et d’autres, prêts à imprimer et vérifiés au scanner.

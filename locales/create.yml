create.watermark-tile.name:
  en: Watermark tile
  fr: Tuile de filigrane
  de: "Wasserzeichen-Kachel"
  es: "Baldosa de marca de agua"
  it: "Tassello filigrana"
  pt-BR: "Ladrilho de marca d’água"
  ja: "透かしタイル"
  zh-CN: "水印平铺"
  ko: "워터마크 타일"
create.watermark-tile.desc:
  en: A repeating, semi-transparent text watermark (“Confidential”, “Draft”, © name) to lay over anything.
  fr: Un filigrane de texte répété et semi-transparent (« Confidentiel », « Brouillon », © nom) à superposer à tout.
  de: "Ein sich wiederholendes, halbtransparentes Text-Wasserzeichen („Vertraulich“, „Entwurf“, © Name) zum Auflegen auf alles."
  es: "Una marca de agua de texto repetida y semitransparente (“Confidencial”, “Borrador”, © nombre) para superponer a cualquier cosa."
  it: "Una filigrana di testo ripetuta e semitrasparente (“Riservato”, “Bozza”, © nome) da sovrapporre a qualsiasi cosa."
  pt-BR: "Uma marca d’água de texto repetida e semitransparente (“Confidencial”, “Rascunho”, © nome) para sobrepor a qualquer coisa."
  ja: "「社外秘」「下書き」「© 名前」などの半透明テキストを繰り返し並べた透かしを作成し、何にでも重ねられます。"
  zh-CN: "重复排列的半透明文字水印（“机密”“草稿”“© 名称”），可叠加到任何内容上。"
  ko: "“대외비”, “초안”, “© 이름” 같은 반투명 텍스트가 반복되는 워터마크로, 어디에든 겹쳐 쓸 수 있습니다."
create.watermark-tile.verb:
  en: Create tile
  fr: Créer la tuile
  de: "Kachel erstellen"
  es: "Crear baldosa"
  it: "Crea tassello"
  pt-BR: "Criar ladrilho"
  ja: "タイルを作成"
  zh-CN: "创建平铺"
  ko: "타일 만들기"
create.watermark-tile.keywords:
  en: watermark tile overlay confidential draft copyright proof repeat transparent
  fr: filigrane tuile superposition confidentiel brouillon copyright épreuve répétition transparent
  de: "wasserzeichen kachel überlagerung vertraulich entwurf copyright korrektur wiederholen transparent"

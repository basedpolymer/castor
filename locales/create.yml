create.motion.desc:
  en: Lower thirds, text reveals, logo stings and title cards as short clips with a transparent background.
  fr: Bandeaux de nom, textes qui apparaissent, animations de logo et cartons de titre, en clips courts sur fond transparent.
  de: "Bauchbinden, Text-Reveals, Logo-Stings und Titelkarten als kurze Clips mit transparentem Hintergrund."
  es: "Rótulos inferiores, revelados de texto, animaciones de logotipo y tarjetas de título como clips cortos con fondo transparente."
  it: "Lower third, comparse di testo, sting di logo e schermate titolo come brevi clip con sfondo trasparente."
  pt-BR: "Tarjas, revelações de texto, vinhetas de logotipo e cartelas de título como clipes curtos com fundo transparente."
  ja: "ローワーサード、テキストの出現演出、ロゴスティング、タイトルカードを、背景透明の短いクリップとして作成します。"
  zh-CN: "下三分之一字幕条、文字显现、徽标动画和标题卡，输出为背景透明的短片。"
  ko: "하단 자막바, 텍스트 등장 효과, 로고 스팅, 타이틀 카드를 배경이 투명한 짧은 클립으로 만듭니다."

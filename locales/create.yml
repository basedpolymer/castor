create.mockup.desc:
  en: Put a screenshot or a screen recording into a phone, laptop or browser window on a styled scene.
  fr: Placez une capture ou un enregistrement d’écran dans un téléphone, un portable ou une fenêtre de navigateur, sur une scène soignée.
  de: "Einen Screenshot oder eine Bildschirmaufnahme in ein Smartphone, einen Laptop oder ein Browserfenster in einer gestalteten Szene einsetzen."
  es: "Coloca una captura o una grabación de pantalla en un móvil, un portátil o una ventana de navegador sobre una escena con estilo."
  it: "Inserisci uno screenshot o una registrazione dello schermo in un telefono, un portatile o una finestra del browser su una scena curata."
  pt-BR: "Coloque uma captura ou gravação de tela em um celular, notebook ou janela de navegador, numa cena estilizada."
  ja: "スクリーンショットや画面録画を、スマホ・ノートPC・ブラウザーウィンドウに入れて、おしゃれな背景に配置します。"
  zh-CN: "把截图或屏幕录制放进手机、笔记本电脑或浏览器窗口，并置于精美场景中。"
  ko: "스크린샷이나 화면 녹화를 휴대폰, 노트북, 브라우저 창에 넣어 멋진 배경 위에 배치합니다."

create.barcode.err.latin1:
  en: "This barcode type only carries Western European characters (no emoji, Greek, Cyrillic, Asian scripts…). Use a QR code for other text."
  fr: "Ce type de code-barres ne porte que les caractères d’Europe de l’Ouest (pas d’emoji, de grec, de cyrillique, d’écritures asiatiques…). Utilisez un code QR pour les autres textes."
  de: "Dieser Barcode-Typ kann nur westeuropäische Zeichen enthalten (keine Emojis, kein Griechisch, Kyrillisch, keine asiatischen Schriften …). Verwenden Sie für anderen Text einen QR-Code."
  es: "Este tipo de código de barras solo admite caracteres de Europa occidental (sin emojis, griego, cirílico, escrituras asiáticas…). Usa un código QR para otros textos."
  it: "Questo tipo di codice a barre accetta solo caratteri dell’Europa occidentale (niente emoji, greco, cirillico, scritture asiatiche…). Usa un codice QR per altri testi."
  pt-BR: "Este tipo de código de barras aceita apenas caracteres da Europa Ocidental (sem emojis, grego, cirílico, escritas asiáticas…). Use um código QR para outros textos."
  ja: "この種類のバーコードは西ヨーロッパの文字しか扱えません (絵文字、ギリシャ文字、キリル文字、アジアの文字などは不可)。それ以外のテキストには QR コードを使ってください。"
  zh-CN: "此类条形码仅支持西欧字符（不支持表情符号、希腊文、西里尔文、亚洲文字等）。其他文字请使用二维码。"
  ko: "이 바코드 종류는 서유럽 문자만 담을 수 있습니다(이모지, 그리스 문자, 키릴 문자, 아시아 문자 등 불가). 다른 텍스트에는 QR 코드를 사용하세요."

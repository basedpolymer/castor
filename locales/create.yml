create.data-merge.opt.template.help:
  en: "Each row’s columns are in sys.inputs (e.g. #sys.inputs.name) and in json(\"/row.json\"). Images next to the template can be used."
  fr: "Les colonnes de chaque ligne sont dans sys.inputs (p. ex. #sys.inputs.name) et dans json(\"/row.json\"). Les images à côté du modèle sont utilisables."
  de: "Die Spalten jeder Zeile stehen in sys.inputs (z. B. #sys.inputs.name) und in json(\"/row.json\"). Bilder neben der Vorlage können verwendet werden."
  es: "Las columnas de cada fila están en sys.inputs (p. ej. #sys.inputs.name) y en json(\"/row.json\"). Puedes usar imágenes junto a la plantilla."

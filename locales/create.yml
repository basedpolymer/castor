create.qr-code.err.no_scan:
  en: This design does not scan reliably. Raise the contrast, make the logo smaller or pick another style.
  fr: Ce rendu ne se scanne pas de façon fiable. Augmentez le contraste, réduisez le logo ou changez de style.
  de: "Dieses Design lässt sich nicht zuverlässig scannen. Erhöhen Sie den Kontrast, verkleinern Sie das Logo oder wählen Sie einen anderen Stil."
  es: "Este diseño no se escanea de forma fiable. Sube el contraste, reduce el logotipo o elige otro estilo."
  it: "Questo design non si scansiona in modo affidabile. Aumenta il contrasto, riduci il logo o scegli un altro stile."
  pt-BR: "Este design não escaneia de forma confiável. Aumente o contraste, reduza o logotipo ou escolha outro estilo."
  ja: "このデザインは確実に読み取れません。コントラストを上げる、ロゴを小さくする、または別のスタイルを選んでください。"
  zh-CN: "此设计无法可靠扫描。请提高对比度、缩小徽标或换一种样式。"
  ko: "이 디자인은 안정적으로 스캔되지 않습니다. 대비를 높이거나, 로고를 줄이거나, 다른 스타일을 선택하세요."
create.qr-code.err.empty:

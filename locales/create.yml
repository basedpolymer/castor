  it: "Inserisci %{n} cifre (la cifra di controllo viene aggiunta) o %{m} cifre."
  pt-BR: "Informe %{n} dígitos (o dígito verificador é adicionado) ou %{m} dígitos."
  ja: "%{n} 桁 (チェックディジットは自動追加) または %{m} 桁を入力してください。"
  zh-CN: "请输入 %{n} 位数字（自动添加校验位）或 %{m} 位数字。"
  ko: "%{n}자리(체크 디지트 자동 추가) 또는 %{m}자리를 입력하세요."
create.barcode.err.check:
  en: "Wrong check digit: it should be %{digit}."
  fr: "Clé de contrôle erronée : elle devrait être %{digit}."
  de: "Falsche Prüfziffer: Sie müsste %{digit} sein."
  es: "Dígito de control incorrecto: debería ser %{digit}."
  it: "Cifra di controllo errata: dovrebbe essere %{digit}."
  pt-BR: "Dígito verificador incorreto: deveria ser %{digit}."
  ja: "チェックディジットが正しくありません。正しくは %{digit} です。"
  zh-CN: "校验位错误：应为 %{digit}。"
  ko: "체크 디지트가 올바르지 않습니다. %{digit}이어야 합니다."
create.barcode.err.itf_even:
  en: ITF needs an even number of digits.
  fr: L’ITF demande un nombre pair de chiffres.
  de: "ITF benötigt eine gerade Anzahl an Ziffern."
  es: "ITF necesita un número par de dígitos."
  it: "ITF richiede un numero pari di cifre."
  pt-BR: "ITF exige um número par de dígitos."
  ja: "ITF には偶数桁の数字が必要です。"
  zh-CN: "ITF 需要偶数位数字。"
  ko: "ITF는 짝수 자릿수의 숫자가 필요합니다."
create.barcode.err.code39:
  en: "Code 39 takes A–Z, 0–9, space and - . $ / + %."
  fr: "Le Code 39 accepte A–Z, 0–9, l’espace et - . $ / + %."
  de: "Code 39 erlaubt A–Z, 0–9, Leerzeichen und - . $ / + %."
  es: "Code 39 admite A–Z, 0–9, espacio y - . $ / + %."
  it: "Il Code 39 accetta A–Z, 0–9, spazio e - . $ / + %."
  pt-BR: "O Code 39 aceita A–Z, 0–9, espaço e - . $ / + %."
  ja: "Code 39 では A–Z、0–9、スペース、- . $ / + % が使えます。"
  zh-CN: "Code 39 支持 A–Z、0–9、空格以及 - . $ / + %。"
  ko: "Code 39는 A–Z, 0–9, 공백, - . $ / + %를 사용할 수 있습니다."
create.barcode.err.codabar:
  en: "Codabar takes digits, - $ : / . + and the start/stop letters A–D."
  fr: "Le Codabar accepte les chiffres, - $ : / . + et les lettres de début/fin A–D."
  de: "Codabar erlaubt Ziffern, - $ : / . + sowie die Start-/Stoppbuchstaben A–D."
  es: "Codabar admite dígitos, - $ : / . + y las letras de inicio/fin A–D."
  it: "Il Codabar accetta cifre, - $ : / . + e le lettere di inizio/fine A–D."
  pt-BR: "O Codabar aceita dígitos, - $ : / . + e as letras de início/fim A–D."
  ja: "Codabar では数字、- $ : / . +、開始/終了文字 A–D が使えます。"
  zh-CN: "Codabar 支持数字、- $ : / . + 以及起止字母 A–D。"
  ko: "Codabar는 숫자, - $ : / . + 및 시작/종료 문자 A–D를 사용할 수 있습니다."
create.barcode.err.ascii:
  en: Code 128 only encodes plain ASCII characters; use Data Matrix for accents.
  fr: Le Code 128 n’encode que l’ASCII ; utilisez Data Matrix pour les accents.
  de: "Code 128 kodiert nur einfache ASCII-Zeichen; für Akzente verwenden Sie Data Matrix."
  es: "Code 128 solo codifica caracteres ASCII simples; usa Data Matrix para los acentos."
  it: "Il Code 128 codifica solo caratteri ASCII semplici; per gli accenti usa Data Matrix."
  pt-BR: "O Code 128 codifica apenas caracteres ASCII simples; use Data Matrix para acentos."
  ja: "Code 128 は基本的な ASCII 文字のみ対応です。アクセント付き文字には Data Matrix を使ってください。"
  zh-CN: "Code 128 只能编码普通 ASCII 字符；带重音符号的字符请使用 Data Matrix。"
  ko: "Code 128은 기본 ASCII 문자만 인코딩합니다. 악센트 문자는 Data Matrix를 사용하세요."
create.barcode.err.encode:
  en: Could not encode this data
  fr: Impossible d’encoder ces données
  de: "Diese Daten konnten nicht kodiert werden"
  es: "No se pudieron codificar estos datos"
  it: "Impossibile codificare questi dati"
  pt-BR: "Não foi possível codificar estes dados"
  ja: "このデータはエンコードできませんでした"
  zh-CN: "无法编码这些数据"
  ko: "이 데이터를 인코딩할 수 없습니다"
create.barcode.err.no_scan:
  en: The barcode could not be read back. Raise the contrast or the height.
  fr: Le code-barres n’a pas pu être relu. Augmentez le contraste ou la hauteur.
  de: "Der Barcode konnte nicht zurückgelesen werden. Erhöhen Sie Kontrast oder Höhe."
  es: "No se pudo volver a leer el código de barras. Sube el contraste o la altura."
  it: "Il codice a barre non è stato riletto correttamente. Aumenta il contrasto o l’altezza."
  pt-BR: "Não foi possível reler o código de barras. Aumente o contraste ou a altura."
  ja: "バーコードを読み戻せませんでした。コントラストか高さを上げてください。"
  zh-CN: "无法回读该条形码。请提高对比度或高度。"
  ko: "바코드를 다시 읽을 수 없습니다. 대비나 높이를 높이세요."
create.barcode.err.mismatch:
  en: "The barcode reads back as “%{read}”, not what was asked."
  fr: "Le code-barres se relit « %{read} », pas ce qui était demandé."
  de: "Der Barcode wird als „%{read}“ gelesen, nicht wie gewünscht."
  es: "El código de barras se lee como “%{read}”, no como se pidió."
  it: "Il codice a barre viene letto come “%{read}”, non come richiesto."
  pt-BR: "O código de barras é lido como “%{read}”, não como solicitado."
  ja: "バーコードは「%{read}」と読み取られ、指定した内容と一致しません。"
  zh-CN: "该条形码回读为“%{read}”，与所需内容不符。"
  ko: "바코드가 요청한 내용이 아니라 “%{read}”(으)로 읽힙니다."

create.common.err.size:
  en: "Width and height must be between 16 and 16,384 pixels."
  fr: "La largeur et la hauteur doivent être comprises entre 16 et 16 384 pixels."
  de: "Breite und Höhe müssen zwischen 16 und 16.384 Pixeln liegen."
  es: "El ancho y el alto deben estar entre 16 y 16 384 píxeles."
  it: "Larghezza e altezza devono essere comprese tra 16 e 16.384 pixel."
  pt-BR: "Largura e altura devem estar entre 16 e 16.384 pixels."
  ja: "幅と高さは 16 ～ 16,384 ピクセルの範囲で指定してください。"
  zh-CN: "宽度和高度必须在 16 到 16,384 像素之间。"
  ko: "너비와 높이는 16~16,384픽셀이어야 합니다."


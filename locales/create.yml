create.fonts.opt.allow_network.help:
  en: Off by default. Only the font files of this family are fetched.
  fr: Désactivé par défaut. Seuls les fichiers de cette famille sont récupérés.
  de: "Standardmäßig aus. Es werden nur die Schriftdateien dieser Familie abgerufen."
  es: "Desactivado por defecto. Solo se obtienen los archivos de fuente de esta familia."
  it: "Disattivato per impostazione predefinita. Vengono scaricati solo i file font di questa famiglia."
  pt-BR: "Desativado por padrão. Apenas os arquivos de fonte desta família são obtidos."
  ja: "初期状態ではオフです。このファミリーのフォントファイルだけを取得します。"
  zh-CN: "默认关闭。只会获取此字体系列的字体文件。"
  ko: "기본적으로 꺼져 있습니다. 이 패밀리의 글꼴 파일만 가져옵니다."
create.fonts.err.no_font:
  en: Drop one or more font files (TTF, OTF, WOFF, WOFF2).
  fr: Déposez un ou plusieurs fichiers de police (TTF, OTF, WOFF, WOFF2).
  de: "Legen Sie eine oder mehrere Schriftdateien ab (TTF, OTF, WOFF, WOFF2)."
  es: "Suelta uno o varios archivos de fuente (TTF, OTF, WOFF, WOFF2)."
  it: "Trascina uno o più file font (TTF, OTF, WOFF, WOFF2)."
  pt-BR: "Solte um ou mais arquivos de fonte (TTF, OTF, WOFF, WOFF2)."
  ja: "フォントファイル (TTF、OTF、WOFF、WOFF2) を 1 つ以上ドロップしてください。"
  zh-CN: "请拖入一个或多个字体文件（TTF、OTF、WOFF、WOFF2）。"
  ko: "글꼴 파일(TTF, OTF, WOFF, WOFF2)을 하나 이상 끌어다 놓으세요."
create.fonts.err.not_font:
  en: This is not a font file Castor can read.
  fr: Ce n’est pas un fichier de police lisible par Castor.
  de: "Dies ist keine Schriftdatei, die Castor lesen kann."
  es: "Este no es un archivo de fuente que Castor pueda leer."
  it: "Questo non è un file font che Castor può leggere."
  pt-BR: "Este não é um arquivo de fonte que o Castor consiga ler."
  ja: "Castor が読み取れるフォントファイルではありません。"
  zh-CN: "这不是 Castor 能读取的字体文件。"
  ko: "Castor에서 읽을 수 있는 글꼴 파일이 아닙니다."
create.fonts.err.collection:
  en: Font collections (TTC) cannot become WOFF; convert to WOFF2 or extract a single font first.
  fr: Une collection de polices (TTC) ne peut pas devenir WOFF ; convertissez en WOFF2 ou extrayez d’abord une police.
  de: "Schriftsammlungen (TTC) lassen sich nicht in WOFF umwandeln; wandeln Sie in WOFF2 um oder extrahieren Sie zuerst eine einzelne Schrift."
  es: "Las colecciones de fuentes (TTC) no pueden convertirse a WOFF; convierte a WOFF2 o extrae primero una sola fuente."
  it: "Le raccolte di font (TTC) non possono diventare WOFF; converti in WOFF2 o estrai prima un singolo font."
  pt-BR: "Coleções de fontes (TTC) não podem virar WOFF; converta para WOFF2 ou extraia antes uma única fonte."
  ja: "フォントコレクション (TTC) は WOFF にできません。WOFF2 に変換するか、先に単一のフォントを取り出してください。"
  zh-CN: "字体集合（TTC）无法转为 WOFF；请转换为 WOFF2，或先提取单个字体。"
  ko: "글꼴 컬렉션(TTC)은 WOFF로 변환할 수 없습니다. WOFF2로 변환하거나 먼저 글꼴 하나를 추출하세요."
create.fonts.err.none_found:
  en: No installed font matches.
  fr: Aucune police installée ne correspond.
  de: "Keine installierte Schrift passt."
  es: "Ninguna fuente instalada coincide."
  it: "Nessun font installato corrisponde."
  pt-BR: "Nenhuma fonte instalada corresponde."
  ja: "一致するインストール済みフォントがありません。"
  zh-CN: "没有匹配的已安装字体。"
  ko: "일치하는 설치된 글꼴이 없습니다."
create.fonts.err.consent:
  en: Tick “Allow downloading” first — Castor never goes online on its own.
  fr: Cochez d’abord « Autoriser le téléchargement » — Castor ne se connecte jamais de lui-même.
  de: "Aktivieren Sie zuerst „Download erlauben“ – Castor geht nie von selbst online."
  es: "Marca primero “Permitir descargar”: Castor nunca se conecta por su cuenta."
  it: "Spunta prima “Consenti il download”: Castor non si collega mai a Internet da solo."
  pt-BR: "Marque primeiro “Permitir baixar”: o Castor nunca se conecta à internet por conta própria."
  ja: "先に「ダウンロードを許可」をオンにしてください。Castor が勝手にオンライン接続することはありません。"
  zh-CN: "请先勾选“允许下载”：Castor 绝不会自行联网。"
  ko: "먼저 “다운로드 허용”을 체크하세요. Castor는 스스로 인터넷에 연결하지 않습니다."
create.fonts.err.family:
  en: Enter a family name.
  fr: Saisissez un nom de famille.
  de: "Geben Sie einen Familiennamen ein."
  es: "Introduce el nombre de una familia."
  it: "Inserisci il nome di una famiglia."
  pt-BR: "Informe o nome de uma família."
  ja: "ファミリー名を入力してください。"
  zh-CN: "请输入字体系列名称。"
  ko: "글꼴 패밀리 이름을 입력하세요."
create.fonts.err.not_on_google:
  en: "“%{family}” was not found in the Google Fonts repository."
  fr: "« %{family} » est introuvable dans le dépôt Google Fonts."
  de: "„%{family}“ wurde im Google-Fonts-Repository nicht gefunden."
  es: "No se encontró “%{family}” en el repositorio de Google Fonts."
  it: "“%{family}” non è stato trovato nel repository di Google Fonts."
  pt-BR: "“%{family}” não foi encontrada no repositório do Google Fonts."
  ja: "「%{family}」は Google Fonts のリポジトリに見つかりませんでした。"
  zh-CN: "在 Google Fonts 仓库中未找到“%{family}”。"
  ko: "Google Fonts 저장소에서 “%{family}”을(를) 찾을 수 없습니다."


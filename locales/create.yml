create.gradient.name:
  en: Gradients
  fr: Dégradés
  de: "Farbverläufe"
  es: "Degradados"
  it: "Gradienti"
  pt-BR: "Gradientes"
  ja: "グラデーション"
  zh-CN: "渐变"
  ko: "그라데이션"
create.gradient.desc:
  en: Soft mesh gradients with grain and light, as images of any size or seamless looping videos.
  fr: Des dégradés maillés tout en douceur, avec grain et lumière, en images de toute taille ou en vidéos en boucle parfaite.
  de: "Weiche Mesh-Verläufe mit Körnung und Licht – als Bilder in beliebiger Größe oder als nahtlos laufende Videos."
  es: "Degradados de malla suaves con grano y luz, como imágenes de cualquier tamaño o vídeos en bucle sin cortes."
  it: "Morbidi gradienti mesh con grana e luce, come immagini di qualsiasi dimensione o video in loop senza stacchi."
  pt-BR: "Gradientes de malha suaves com granulação e luz, como imagens de qualquer tamanho ou vídeos em loop contínuo."
  ja: "粒子と光を加えたやわらかなメッシュグラデーションを、好きなサイズの画像やシームレスなループ動画として作成します。"
  zh-CN: "带颗粒和光感的柔和网格渐变，可输出任意尺寸的图片或无缝循环视频。"
  ko: "노이즈와 빛이 더해진 부드러운 메시 그라데이션을 원하는 크기의 이미지나 끊김 없는 반복 동영상으로 만듭니다."

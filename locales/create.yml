create.audiogram.desc:
  en: Turn a podcast or voice clip into a video for social media — animated waveform, title, cover and captions.
  fr: Transformez un extrait de podcast ou de voix en vidéo pour les réseaux — onde animée, titre, couverture et sous-titres.
  de: "Aus einem Podcast oder Sprachclip ein Video für Social Media machen – mit animierter Wellenform, Titel, Cover und Untertiteln."
  es: "Convierte un podcast o un clip de voz en un vídeo para redes sociales: onda animada, título, portada y subtítulos."
  it: "Trasforma un podcast o una clip vocale in un video per i social: forma d’onda animata, titolo, copertina e sottotitoli."
  pt-BR: "Transforme um podcast ou clipe de voz em um vídeo para redes sociais: onda animada, título, capa e legendas."
  ja: "ポッドキャストや音声クリップを、アニメーションする波形・タイトル・カバー・字幕つきの SNS 向け動画にします。"
  zh-CN: "将播客或语音片段变成适合社交媒体的视频：动态波形、标题、封面和字幕。"
  ko: "팟캐스트나 음성 클립을 움직이는 파형, 제목, 커버, 자막이 있는 소셜 미디어용 동영상으로 만듭니다."

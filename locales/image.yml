image.resize.opt.mode.help:
  en: "Fit keeps everything; Fill covers the size and crops what sticks out; Fit with background adds bars."
  fr: "« Tenir » garde tout ; « Remplir » couvre la taille et coupe ce qui dépasse ; « avec un fond » ajoute des bandes."
  de: "„Einpassen“ behält alles; „Füllen“ deckt die Größe ab und schneidet Überstehendes ab; „Einpassen mit Hintergrund“ ergänzt Balken."
  es: "«Ajustar dentro» conserva todo; «Rellenar» cubre el tamaño y recorta lo que sobra; «Ajustar con fondo» añade barras."
  it: "«Adatta» mantiene tutto; «Riempi» copre la dimensione e ritaglia ciò che sporge; «Adatta con sfondo» aggiunge bande."
  pt-BR: "“Ajustar dentro” mantém tudo; “Preencher” cobre o tamanho e corta o que sobra; “Ajustar com fundo” adiciona barras."
  ja: "「収める」は全体を残し、「埋めてトリミング」はサイズを埋めてはみ出す部分を切り、「背景付きで収める」は余白に帯を加えます。"
  zh-CN: "“适应范围”保留全部内容；“填满并裁剪”铺满目标尺寸并裁掉多余部分；“适应并填充背景”会补上边条。"
  ko: "'안에 맞추기'는 전체를 유지하고, '채우고 자르기'는 크기를 채운 뒤 넘치는 부분을 자르며, '배경과 함께 맞추기'는 띠를 추가합니다."

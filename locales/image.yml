image.crop.desc:
  en: "Crop to a ratio, cut margins, or trim plain borders automatically."
  fr: "Recadre à un format, coupe des marges ou retire les bordures unies automatiquement."
  de: "Auf ein Seitenverhältnis zuschneiden, Ränder abschneiden oder einfarbige Ränder automatisch entfernen."
  es: "Recorta a una proporción, quita márgenes o elimina bordes lisos automáticamente."
  it: "Ritaglia secondo una proporzione, taglia i margini o rimuove automaticamente i bordi uniformi."
  pt-BR: "Corta para uma proporção, remove margens ou apara bordas lisas automaticamente."
  ja: "縦横比に合わせたトリミング、余白のカット、無地の縁の自動除去ができます。"
  zh-CN: "按比例裁剪、裁掉边距，或自动去除纯色边框。"
  ko: "비율에 맞춰 자르거나, 여백을 잘라내거나, 단색 테두리를 자동으로 제거합니다."

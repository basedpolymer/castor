  en: "Put screenshots on a painted background with shadow, corners and a window frame."
  fr: "Pose vos captures sur un fond peint, avec ombre, coins arrondis et cadre de fenêtre."
  de: "Setzt Screenshots auf einen gemalten Hintergrund mit Schatten, runden Ecken und Fensterrahmen."
  es: "Coloca las capturas sobre un fondo pintado con sombra, esquinas redondeadas y marco de ventana."
  it: "Mette gli screenshot su uno sfondo dipinto con ombra, angoli arrotondati e cornice di finestra."
  pt-BR: "Coloca capturas de tela sobre um fundo pintado com sombra, cantos arredondados e moldura de janela."
  ja: "スクリーンショットを、影・角丸・ウィンドウ枠つきの彩色背景にのせます。"
  zh-CN: "把截图放在带阴影、圆角和窗口边框的彩色背景上。"
  ko: "스크린샷을 그림자, 둥근 모서리, 창 프레임이 있는 색칠된 배경 위에 올립니다."

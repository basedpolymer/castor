  en: "Up to 256 well-chosen colours, like TinyPNG: often 70 % smaller."
  fr: "Jusqu’à 256 couleurs bien choisies, comme TinyPNG : souvent 70 % plus léger."
  de: "Bis zu 256 gut gewählte Farben wie bei TinyPNG: oft 70 % kleiner."
  es: "Hasta 256 colores bien elegidos, como TinyPNG: a menudo un 70 % más pequeño."
  it: "Fino a 256 colori scelti con cura, come TinyPNG: spesso il 70 % più piccolo."
  pt-BR: "Até 256 cores bem escolhidas, como o TinyPNG: muitas vezes 70 % menor."
  ja: "TinyPNG のように、厳選した最大 256 色に減らします。多くの場合 70 % ほど小さくなります。"
  zh-CN: "最多 256 种精挑细选的颜色，类似 TinyPNG:体积常可减小 70 %。"
  ko: "TinyPNG처럼 엄선한 최대 256색으로 줄입니다. 용량이 70 %가량 줄어드는 경우가 많습니다."

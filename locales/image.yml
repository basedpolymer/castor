image.seo.bad_gps:
  en: "The location should look like \"48.8584, 2.2945\" (latitude, longitude)."
  fr: "La position doit ressembler à « 48.8584, 2.2945 » (latitude, longitude)."
  de: "Der Standort sollte so aussehen: „48.8584, 2.2945“ (Breitengrad, Längengrad)."
  es: "La ubicación debe tener este aspecto: «48.8584, 2.2945» (latitud, longitud)."
  it: "La posizione deve avere questa forma: «48.8584, 2.2945» (latitudine, longitudine)."
  pt-BR: "A localização deve ter este formato: “48.8584, 2.2945” (latitude, longitude)."
  ja: "位置は「48.8584, 2.2945」(緯度、経度)の形式で入力してください。"
  zh-CN: "位置应类似“48.8584, 2.2945”(纬度，经度)。"
  ko: "위치는 '48.8584, 2.2945'(위도, 경도) 형식이어야 합니다."
image.seo.ai_failed:
  en: "Writing with AI failed. Check your API key and connection, or turn the option off."
  fr: "L’écriture par l’IA a échoué. Vérifiez votre clé d’API et la connexion, ou désactivez l’option."
  de: "Das Schreiben mit KI ist fehlgeschlagen. Prüfen Sie Ihren API-Schlüssel und die Verbindung oder schalten Sie die Option aus."
  es: "Falló la escritura con IA. Revisa tu clave de API y la conexión, o desactiva la opción."
  it: "La scrittura con IA non è riuscita. Controlla la chiave API e la connessione, oppure disattiva l'opzione."
  pt-BR: "A escrita com IA falhou. Verifique sua chave de API e a conexão, ou desative a opção."
  ja: "AI での作成に失敗しました。API キーと接続を確認するか、オプションをオフにしてください。"
  zh-CN: "AI 撰写失败。请检查 API 密钥和网络连接，或关闭此选项。"
  ko: "AI 작성에 실패했습니다. API 키와 연결 상태를 확인하거나 옵션을 끄세요."

image.resize.opt.enlarge.help:
  en: "Off, small images are left at their size instead of becoming blurry."
  fr: "Désactivé, les petites images gardent leur taille au lieu de devenir floues."
  de: "Aus bleiben kleine Bilder in ihrer Größe, statt unscharf zu werden."
  es: "Desactivado, las imágenes pequeñas conservan su tamaño en lugar de volverse borrosas."
  it: "Disattivato, le immagini piccole restano della loro dimensione invece di sfocarsi."
  pt-BR: "Desativado, imagens pequenas mantêm o tamanho em vez de ficarem desfocadas."
  ja: "オフにすると、小さな画像はぼやけずに元のサイズのまま残ります。"
  zh-CN: "关闭后，小图将保持原尺寸，不会因放大而变模糊。"
  ko: "끄면 작은 이미지는 흐려지지 않고 원래 크기를 유지합니다."

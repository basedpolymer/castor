image.crop.opt.tolerance.help:
  en: "How different from the border colour a pixel must be to count as content."
  fr: "Écart à la couleur de bordure à partir duquel un pixel compte comme contenu."
  de: "Wie stark sich ein Pixel von der Randfarbe unterscheiden muss, um als Inhalt zu gelten."
  es: "Cuánto debe diferir un píxel del color del borde para contar como contenido."
  it: "Quanto un pixel deve differire dal colore del bordo per essere considerato contenuto."
  pt-BR: "O quanto um pixel precisa diferir da cor da borda para contar como conteúdo."
  ja: "ピクセルが縁の色とどのくらい違えば内容とみなすかを指定します。"
  zh-CN: "像素与边框颜色相差多少才算作内容。"
  ko: "픽셀이 테두리 색과 얼마나 달라야 내용으로 간주할지 정합니다."

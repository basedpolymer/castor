  fr: "Retire le halo de l’ancien fond autour des cheveux et des bords doux."
  de: "Entfernt den Farbsaum des alten Hintergrunds an Haaren und weichen Kanten."
  es: "Elimina el halo del fondo anterior alrededor del pelo y los bordes suaves."
  it: "Elimina l'alone del vecchio sfondo attorno a capelli e bordi morbidi."
  pt-BR: "Remove o halo do fundo antigo ao redor de cabelos e bordas suaves."
  ja: "髪の毛や柔らかい輪郭に残る、元の背景の縁取りを取り除きます。"
  zh-CN: "去除发丝和柔和边缘上残留的旧背景色晕。"

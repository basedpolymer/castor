image.duplicates.desc:
  en: "Spot identical and near-identical pictures, even resized or recompressed."
  fr: "Repère les images identiques ou presque, même redimensionnées ou recompressées."
  de: "Erkennt identische und nahezu identische Bilder, auch wenn sie skaliert oder neu komprimiert wurden."
  es: "Detecta imágenes idénticas y casi idénticas, aunque estén redimensionadas o recomprimidas."
  it: "Individua immagini identiche e quasi identiche, anche se ridimensionate o ricompresse."
  pt-BR: "Detecta imagens idênticas e quase idênticas, mesmo redimensionadas ou recomprimidas."
  ja: "同一または酷似した画像を、リサイズや再圧縮されていても見つけ出します。"
  zh-CN: "找出相同或近乎相同的图片，即使已被缩放或重新压缩。"
  ko: "크기를 바꾸거나 다시 압축했더라도 동일하거나 거의 같은 이미지를 찾아냅니다."

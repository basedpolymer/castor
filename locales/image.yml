image.upscale.name:
  en: "AI upscale"
  fr: "Agrandir avec l’IA"
  de: "KI-Hochskalierung"
  es: "Ampliación con IA"
  it: "Upscale con IA"
  pt-BR: "Ampliação com IA"
  ja: "AI アップスケール"
  zh-CN: "AI 放大"
  ko: "AI 업스케일"
image.upscale.desc:
  en: "Enlarge 2×, 3× or 4× with a local super-resolution model: sharp, not blurry."
  fr: "Agrandit ×2, ×3 ou ×4 avec un modèle local de super-résolution : net, pas flou."
  de: "Vergrößert Bilder mit einem lokalen Super-Resolution-Modell auf das 2-, 3- oder 4-Fache: scharf statt verschwommen."
  es: "Amplía 2×, 3× o 4× con un modelo local de superresolución: nítido, no borroso."
  it: "Ingrandisce 2×, 3× o 4× con un modello locale di super-risoluzione: nitido, non sfocato."
  pt-BR: "Amplia 2×, 3× ou 4× com um modelo local de super-resolução: nítido, sem desfoque."
  ja: "ローカルの超解像モデルで 2 倍・3 倍・4 倍に拡大。ぼやけず、くっきり仕上がります。"
  zh-CN: "用本地超分辨率模型放大 2×、3× 或 4×:清晰不模糊。"
  ko: "로컬 초해상도 모델로 2배, 3배, 4배까지 확대합니다. 흐릿하지 않고 선명합니다."

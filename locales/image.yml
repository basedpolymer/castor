image.compress.opt.keep_metadata.help:
  en: "Off removes camera data and location; colour profile and orientation always stay."
  fr: "Désactivé, retire les données d’appareil et la position ; profil de couleur et orientation sont toujours gardés."
  de: "Aus entfernt Kameradaten und Standort; Farbprofil und Ausrichtung bleiben immer erhalten."
  es: "Desactivado elimina los datos de la cámara y la ubicación; el perfil de color y la orientación siempre se conservan."
  it: "Disattivato rimuove i dati della fotocamera e la posizione; profilo colore e orientamento restano sempre."
  pt-BR: "Desativado remove dados da câmera e localização; perfil de cor e orientação sempre são mantidos."
  ja: "オフにするとカメラ情報と位置情報が削除されます。カラープロファイルと向きは常に保持されます。"
  zh-CN: "关闭后将移除相机数据和位置信息；色彩配置文件和方向始终保留。"
  ko: "끄면 카메라 정보와 위치가 제거됩니다. 색상 프로필과 방향은 항상 유지됩니다."


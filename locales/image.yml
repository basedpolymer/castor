image.remove-background.desc:
  en: "Cut out the subject with a local model, hair and small details included."
  fr: "Détoure le sujet avec un modèle local, cheveux et petits détails compris."
  de: "Stellt das Motiv mit einem lokalen Modell frei – samt Haaren und feinen Details."
  es: "Recorta el sujeto con un modelo local, pelo y detalles finos incluidos."
  it: "Ritaglia il soggetto con un modello locale, capelli e dettagli sottili compresi."
  pt-BR: "Recorta o assunto com um modelo local, incluindo cabelos e pequenos detalhes."
  ja: "ローカルモデルで被写体を切り抜きます。髪の毛や細部もきれいに残します。"
  zh-CN: "用本地模型抠出主体，发丝和细节也不放过。"
  ko: "로컬 모델로 피사체를 오려냅니다. 머리카락과 세부 묘사까지 살립니다."

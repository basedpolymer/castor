image.crop.name:
  en: "Crop image"
  fr: "Recadrer une image"
  de: "Bild zuschneiden"
  es: "Recortar imagen"
  it: "Ritaglia immagine"
  pt-BR: "Cortar imagem"
  ja: "画像をトリミング"

_version: 2
# Owner: image tools (crates/tools-image) and the ML engine (crates/engine-ml).
# Generated layout: one key, en + fr. Keep strings JSON-quoted.

ml.downloading:
  en: "Fetching %{name} (%{size}) once — after that it works offline."
  fr: "Téléchargement unique de %{name} (%{size}) — ensuite tout fonctionne hors ligne."
  de: "%{name} (%{size}) wird einmalig geladen – danach funktioniert alles offline."
  es: "%{name} (%{size}) se descarga una sola vez; después todo funciona sin conexión."
  it: "Scarico %{name} (%{size}) una sola volta: poi tutto funziona offline."
  pt-BR: "%{name} (%{size}) é baixado uma única vez; depois tudo funciona offline."
  ja: "%{name}(%{size})を一度だけダウンロードします。以降はオフラインで動作します。"
  zh-CN: "仅下载一次 %{name}(%{size}),之后即可离线使用。"
  ko: "%{name}(%{size})을(를) 한 번만 다운로드합니다. 이후에는 오프라인으로 작동합니다."
ml.too_big:
  en: "The result would be %{mp} megapixels, too big to be useful. Pick a smaller factor or resize first."
  fr: "Le résultat ferait %{mp} mégapixels, trop pour être utile. Choisissez un facteur plus petit ou réduisez l’image d’abord."
  de: "Das Ergebnis hätte %{mp} Megapixel und wäre damit zu groß, um nützlich zu sein. Wählen Sie einen kleineren Faktor oder verkleinern Sie das Bild zuerst."
  es: "El resultado tendría %{mp} megapíxeles, demasiado grande para ser útil. Elige un factor menor o reduce la imagen antes."
  it: "Il risultato avrebbe %{mp} megapixel, troppi per essere utile. Scegli un fattore più piccolo o ridimensiona prima l'immagine."
  pt-BR: "O resultado teria %{mp} megapixels, grande demais para ser útil. Escolha um fator menor ou redimensione a imagem antes."
  ja: "結果が %{mp} メガピクセルになり、大きすぎて実用的ではありません。倍率を小さくするか、先に画像を縮小してください。"
  zh-CN: "结果将达到 %{mp} 百万像素，过大而不实用。请选择更小的倍数，或先缩小图片。"
  ko: "결과가 %{mp}메가픽셀이 되어 너무 커서 쓸모가 없습니다. 더 작은 배율을 고르거나 먼저 이미지 크기를 줄이세요."

image.err.read:
  en: "Cannot read %{file}. Check that it still exists and that you may open it."
  fr: "Impossible de lire %{file}. Vérifiez qu’il existe toujours et que vous pouvez l’ouvrir."
  de: "%{file} kann nicht gelesen werden. Prüfen Sie, ob die Datei noch existiert und ob Sie sie öffnen dürfen."
  es: "No se puede leer %{file}. Comprueba que sigue existiendo y que tienes permiso para abrirlo."
  it: "Impossibile leggere %{file}. Controlla che esista ancora e che tu abbia il permesso di aprirlo."
  pt-BR: "Não foi possível ler %{file}. Verifique se ele ainda existe e se você tem permissão para abri-lo."
  ja: "%{file} を読み込めません。ファイルがまだ存在すること、開く権限があることを確認してください。"
  zh-CN: "无法读取 %{file}。请检查文件是否仍然存在，以及你是否有权打开它。"
  ko: "%{file}을(를) 읽을 수 없습니다. 파일이 아직 있는지, 열 권한이 있는지 확인하세요."
image.err.empty:
  en: "%{file} is empty (0 bytes)."
  fr: "%{file} est vide (0 octet)."
  de: "%{file} ist leer (0 Byte)."
  es: "%{file} está vacío (0 bytes)."
  it: "%{file} è vuoto (0 byte)."
  pt-BR: "%{file} está vazio (0 byte)."
  ja: "%{file} は空です(0 バイト)。"
  zh-CN: "%{file} 为空(0 字节)。"
  ko: "%{file}이(가) 비어 있습니다(0바이트)."
image.err.unknown_format:
  en: "%{file} is not an image format Castor knows."
  fr: "%{file} n’est pas un format d’image connu de Castor."
  de: "%{file} ist kein Bildformat, das Castor kennt."
  es: "%{file} no es un formato de imagen que Castor conozca."
  it: "%{file} non è un formato di immagine noto a Castor."
  pt-BR: "%{file} não é um formato de imagem que o Castor conhece."
  ja: "%{file} は Castor が認識できる画像形式ではありません。"
  zh-CN: "%{file} 不是 Castor 支持的图片格式。"
  ko: "%{file}은(는) Castor가 알지 못하는 이미지 형식입니다."
image.err.corrupt:
  en: "%{file} could not be decoded (damaged or unsupported variant)"
  fr: "%{file} n’a pas pu être décodé (fichier abîmé ou variante non prise en charge)"
  de: "%{file} konnte nicht dekodiert werden (beschädigt oder nicht unterstützte Variante)"
  es: "No se pudo decodificar %{file} (dañado o variante no compatible)"
  it: "Impossibile decodificare %{file} (danneggiato o variante non supportata)"
  pt-BR: "Não foi possível decodificar %{file} (danificado ou variante não compatível)"
  ja: "%{file} をデコードできませんでした(破損しているか、未対応のバリアントです)"
  zh-CN: "无法解码 %{file}(文件已损坏或为不支持的变体)"
  ko: "%{file}을(를) 디코딩할 수 없습니다(손상되었거나 지원하지 않는 변형입니다)"
image.err.write:
  en: "Cannot write %{file}. Pick another output folder (this one may be read-only or full)."
  fr: "Impossible d’écrire %{file}. Choisissez un autre dossier de sortie (celui-ci est peut-être en lecture seule ou plein)."
  de: "%{file} kann nicht geschrieben werden. Wählen Sie einen anderen Ausgabeordner (dieser ist möglicherweise schreibgeschützt oder voll)."
  es: "No se puede escribir %{file}. Elige otra carpeta de salida (esta quizá es de solo lectura o está llena)."
  it: "Impossibile scrivere %{file}. Scegli un'altra cartella di destinazione (questa potrebbe essere di sola lettura o piena)."
  pt-BR: "Não foi possível gravar %{file}. Escolha outra pasta de saída (esta pode ser somente leitura ou estar cheia)."
  ja: "%{file} を書き込めません。別の出力フォルダーを選んでください(このフォルダーは読み取り専用か、容量がいっぱいの可能性があります)。"
  zh-CN: "无法写入 %{file}。请选择其他输出文件夹(此文件夹可能是只读的或已满)。"
  ko: "%{file}을(를) 쓸 수 없습니다. 다른 출력 폴더를 선택하세요(이 폴더는 읽기 전용이거나 가득 찼을 수 있습니다)."
image.err.heic_write:
  en: "HEIC export uses the macOS image engine and is only available on a Mac. Pick JPG, WebP or AVIF instead."
  fr: "L’export HEIC passe par le moteur d’images de macOS et n’existe que sur Mac. Choisissez plutôt JPG, WebP ou AVIF."
  de: "Der HEIC-Export nutzt die Bild-Engine von macOS und ist nur auf einem Mac verfügbar. Wählen Sie stattdessen JPG, WebP oder AVIF."
  es: "La exportación a HEIC usa el motor de imágenes de macOS y solo está disponible en un Mac. Elige JPG, WebP o AVIF."
  it: "L'esportazione HEIC usa il motore immagini di macOS ed è disponibile solo su Mac. Scegli invece JPG, WebP o AVIF."
  pt-BR: "A exportação para HEIC usa o mecanismo de imagens do macOS e só está disponível em um Mac. Escolha JPG, WebP ou AVIF."
  ja: "HEIC の書き出しには macOS の画像エンジンを使うため、Mac でのみ利用できます。代わりに JPG、WebP、AVIF を選んでください。"
  zh-CN: "HEIC 导出依赖 macOS 图像引擎，仅在 Mac 上可用。请改选 JPG、WebP 或 AVIF。"
  ko: "HEIC 내보내기는 macOS 이미지 엔진을 사용하므로 Mac에서만 가능합니다. 대신 JPG, WebP 또는 AVIF를 선택하세요."
image.err.too_big:
  en: "The result would be larger than 400 megapixels. Use smaller dimensions."
  fr: "Le résultat dépasserait 400 mégapixels. Utilisez des dimensions plus petites."
  de: "Das Ergebnis wäre größer als 400 Megapixel. Verwenden Sie kleinere Abmessungen."
  es: "El resultado sería mayor de 400 megapíxeles. Usa dimensiones más pequeñas."
  it: "Il risultato supererebbe i 400 megapixel. Usa dimensioni più piccole."
  pt-BR: "O resultado seria maior que 400 megapixels. Use dimensões menores."
  ja: "結果が 400 メガピクセルを超えてしまいます。サイズを小さくしてください。"
  zh-CN: "结果将超过 4 亿像素。请使用更小的尺寸。"
  ko: "결과가 400메가픽셀보다 커집니다. 더 작은 크기를 사용하세요."


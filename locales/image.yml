image.upscale.opt.model.help:
  en: "Fast suits most pictures; Photo adds finer texture but is about 15 times slower; Art is for drawings and anime."
  fr: "« Rapide » convient à la plupart des images ; « Photo » ajoute des textures plus fines mais est environ 15 fois plus lent ; « Illustration » est pour les dessins et l’anime."
  de: "„Schnell“ passt für die meisten Bilder; „Foto“ liefert feinere Texturen, ist aber etwa 15-mal langsamer; „Kunst“ ist für Zeichnungen und Anime."
  es: "«Rápido» sirve para la mayoría de las imágenes; «Foto» añade textura más fina pero es unas 15 veces más lento; «Arte» es para dibujos y anime."
  it: "«Veloce» va bene per la maggior parte delle immagini; «Foto» aggiunge texture più fini ma è circa 15 volte più lento; «Arte» è per disegni e anime."
  pt-BR: "“Rápido” serve para a maioria das imagens; “Foto” adiciona textura mais fina, mas é cerca de 15 vezes mais lento; “Arte” é para desenhos e animes."
  ja: "「高速」はほとんどの画像に適しています。「写真」はより細かな質感を再現しますが約 15 倍遅くなります。「イラスト」は絵やアニメ向けです。"

image.remove-background.opt.model.help:
  en: "Best handles hair, fur and fine edges; Fast is about four times quicker."
  fr: "« Meilleure » gère cheveux, poils et bords fins ; « Rapide » est environ quatre fois plus vite."
  de: "„Beste“ erfasst Haare, Fell und feine Kanten am besten; „Schnell“ ist etwa viermal so schnell."
  es: "«Mejor» maneja mejor el pelo y los bordes finos; «Rápido» es unas cuatro veces más veloz."
  it: "«Migliore» gestisce meglio capelli, pelo e bordi sottili; «Veloce» è circa quattro volte più rapido."
  pt-BR: "“Melhor” trata melhor cabelos, pelos e bordas finas; “Rápido” é cerca de quatro vezes mais veloz."
  ja: "「最高」は髪の毛や毛皮、細かい輪郭に最適です。「高速」は約 4 倍速く処理できます。"
  zh-CN: "“最佳”最适合发丝、毛发和细致边缘；“快速”约快四倍。"
  ko: "'최고'는 머리카락, 털, 가는 경계를 가장 잘 처리하고, '빠름'은 약 4배 빠릅니다."

image.seo.opt.ai.help:
  en: "Sends a small copy of each image to Anthropic with your own API key to fill empty fields. Off by default; nothing leaves your computer otherwise."
  fr: "Envoie une petite copie de chaque image à Anthropic avec votre propre clé d’API pour remplir les champs vides. Désactivé par défaut ; sinon rien ne quitte votre ordinateur."
  de: "Sendet mit Ihrem eigenen API-Schlüssel eine kleine Kopie jedes Bildes an Anthropic, um leere Felder auszufüllen. Standardmäßig aus; sonst verlässt nichts Ihren Computer."
  es: "Envía una copia pequeña de cada imagen a Anthropic con tu propia clave de API para rellenar los campos vacíos. Desactivado por defecto; si no, nada sale de tu equipo."
  it: "Invia una piccola copia di ogni immagine ad Anthropic con la tua chiave API per compilare i campi vuoti. Disattivato di default; altrimenti nulla lascia il tuo computer."
  pt-BR: "Envia uma pequena cópia de cada imagem à Anthropic, com sua própria chave de API, para preencher os campos vazios. Desativado por padrão; caso contrário, nada sai do seu computador."
  ja: "ご自身の API キーを使い、各画像の小さなコピーを Anthropic に送って空欄を埋めます。初期設定ではオフで、それ以外は何もコンピューターの外に出ません。"
  zh-CN: "使用你自己的 API 密钥，把每张图片的小尺寸副本发送给 Anthropic 以填写空白字段。默认关闭；否则不会有任何内容离开你的电脑。"
  ko: "본인의 API 키로 각 이미지의 작은 사본을 Anthropic에 보내 빈 항목을 채웁니다. 기본값은 꺼짐이며, 그 외에는 아무것도 컴퓨터 밖으로 나가지 않습니다."

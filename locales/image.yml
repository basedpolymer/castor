  en: "Rotate & flip"
  fr: "Pivoter et retourner"
  de: "Drehen & Spiegeln"
  es: "Girar y voltear"
  it: "Ruota e rifletti"
  pt-BR: "Girar e espelhar"
  ja: "回転と反転"
  zh-CN: "旋转与翻转"
  ko: "회전 및 뒤집기"
image.rotate.desc:
  en: "Turn, mirror or straighten images; fix sideways phone photos."
  fr: "Tourne, retourne ou redresse les images ; remet d’aplomb les photos de téléphone."
  de: "Bilder drehen, spiegeln oder geraderichten; quer liegende Handyfotos korrigieren."
  es: "Gira, voltea o endereza imágenes; corrige fotos de móvil de lado."
  it: "Ruota, rifletti o raddrizza le immagini; correggi le foto del telefono di traverso."
  pt-BR: "Gire, espelhe ou endireite imagens; corrija fotos de celular de lado."

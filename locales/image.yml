image.resize.opt.size.help:
  en: "Width × height in pixels. In Fit mode, 0 leaves that side free."
  fr: "Largeur × hauteur en pixels. En mode « Tenir », 0 laisse ce côté libre."
  de: "Breite × Höhe in Pixeln. Im Modus „Einpassen“ lässt 0 diese Seite frei."
  es: "Ancho × alto en píxeles. En modo «Ajustar dentro», 0 deja ese lado libre."
  it: "Larghezza × altezza in pixel. In modalità «Adatta», 0 lascia libero quel lato."
  pt-BR: "Largura × altura em pixels. No modo “Ajustar dentro”, 0 deixa esse lado livre."
  ja: "幅 × 高さ(ピクセル)。「収める」モードでは 0 を指定するとその辺は自由になります。"
  zh-CN: "宽 × 高(像素)。在“适应范围”模式下，0 表示该边不限制。"
  ko: "너비 × 높이(픽셀). '안에 맞추기' 모드에서 0이면 해당 변은 제한하지 않습니다."

video.split.opt.cut.help:
  en: "Exact re-encodes the edges for frame-accurate cuts. Fast copies the streams and cuts at the nearest keyframe (can start up to a few seconds early)."
  fr: "Exacte ré-encode pour couper à l'image près. Rapide copie les flux et coupe à l'image-clé la plus proche (peut commencer quelques secondes plus tôt)."
  de: "„Exakt“ kodiert die Ränder neu für bildgenaue Schnitte. „Schnell“ kopiert die Datenströme und schneidet am nächsten Keyframe (kann bis zu einigen Sekunden zu früh beginnen)."
  es: "«Exacto» recodifica los extremos para cortes precisos al fotograma. «Rápido» copia los flujos y corta en el fotograma clave más cercano (puede empezar hasta unos segundos antes)."
  it: "«Preciso» ricodifica i bordi per tagli al fotogramma. «Veloce» copia i flussi e taglia sul keyframe più vicino (può iniziare fino a qualche secondo prima)."
  pt-BR: "“Exato” recodifica as pontas para cortes precisos ao quadro. “Rápido” copia os fluxos e corta no quadro-chave mais próximo (pode começar até alguns segundos antes)."
  ja: "「正確」は両端を再エンコードして、フレーム単位で正確に切ります。「高速」はストリームをコピーして最も近いキーフレームで切るため、数秒早く始まることがあります。"
  zh-CN: "“精确”会重新编码两端，实现逐帧精准剪切。“快速”直接复制数据流并在最近的关键帧处剪切(可能提前数秒开始)。"
  ko: "'정확'은 양 끝을 다시 인코딩해 프레임 단위로 정확하게 자릅니다. '빠름'은 스트림을 복사하고 가장 가까운 키프레임에서 자르므로 최대 몇 초 일찍 시작할 수 있습니다."

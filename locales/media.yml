video.captions.opt.vad.help:
  en: "Detects speech first: faster on long recordings and avoids invented text in silences. Word timings are less precise."
  fr: "Détecte d'abord la parole : plus rapide sur les longs enregistrements et évite du texte inventé dans les silences. Le minutage des mots est moins précis."
  de: "Erkennt zuerst die Sprache: schneller bei langen Aufnahmen und verhindert erfundenen Text in Stille. Wortzeiten sind weniger genau."
  es: "Detecta primero el habla: más rápido en grabaciones largas y evita texto inventado en los silencios. Los tiempos por palabra son menos precisos."
  it: "Rileva prima il parlato: più veloce nelle registrazioni lunghe e evita testo inventato nei silenzi. I tempi delle parole sono meno precisi."
  pt-BR: "Detecta primeiro a fala: mais rápido em gravações longas e evita texto inventado nos silêncios. Os tempos das palavras ficam menos precisos."
  ja: "先に音声を検出するため、長い録音では高速になり、無音部分で架空のテキストが出るのを防ぎます。単語ごとのタイミングは精度が下がります。"
  zh-CN: "先检测语音：长录音处理更快，并避免在静音处生成虚构文字。逐词时间戳的精度会降低。"
  ko: "먼저 음성을 감지하므로 긴 녹음에서 더 빠르고 무음 구간에서 없는 텍스트가 생기는 것을 막아 줍니다. 단어별 타이밍은 덜 정확합니다."

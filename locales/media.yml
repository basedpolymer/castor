media.err.permission:
  en: "Castor cannot write to the output folder. Choose another folder."
  fr: "Castor ne peut pas écrire dans le dossier de sortie. Choisissez-en un autre."
  de: "Castor kann nicht in den Ausgabeordner schreiben. Wählen Sie einen anderen Ordner."
  es: "Castor no puede escribir en la carpeta de salida. Elige otra carpeta."
  it: "Castor non può scrivere nella cartella di destinazione. Scegli un'altra cartella."
  pt-BR: "O Castor não consegue gravar na pasta de saída. Escolha outra pasta."
  ja: "Castor は出力フォルダーに書き込めません。別のフォルダーを選んでください。"
  zh-CN: "Castor 无法写入输出文件夹。请选择其他文件夹。"

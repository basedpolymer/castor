media.err.disk_full:
  en: "The disk is full. Free some space and try again."
  fr: "Le disque est plein. Libérez de la place et réessayez."
  de: "Der Datenträger ist voll. Schaffen Sie Platz und versuchen Sie es erneut."
  es: "El disco está lleno. Libera espacio e inténtalo de nuevo."
  it: "Il disco è pieno. Libera dello spazio e riprova."
  pt-BR: "O disco está cheio. Libere espaço e tente novamente."
  ja: "ディスクがいっぱいです。空き容量を作ってからもう一度お試しください。"
  zh-CN: "磁盘已满。请释放一些空间后重试。"
  ko: "디스크가 가득 찼습니다. 공간을 확보한 뒤 다시 시도하세요."
media.err.encoder:
  en: "The video encoder could not start. Turn off “Fast (hardware encoder)” and try again."
  fr: "L'encodeur vidéo n'a pas pu démarrer. Désactivez « Rapide (encodeur matériel) » et réessayez."
  de: "Der Video-Encoder konnte nicht gestartet werden. Schalten Sie „Schnell (Hardware-Encoder)“ aus und versuchen Sie es erneut."
  es: "No se pudo iniciar el codificador de vídeo. Desactiva «Rápido (codificador por hardware)» e inténtalo de nuevo."
  it: "Impossibile avviare l'encoder video. Disattiva «Veloce (encoder hardware)» e riprova."

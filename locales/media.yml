  es: "Los modelos más grandes son más precisos y más lentos. Cada uno se descarga una vez y luego funciona sin conexión."
  it: "I modelli più grandi sono più accurati ma più lenti. Ognuno viene scaricato una volta, poi funziona offline."
  pt-BR: "Modelos maiores são mais precisos e mais lentos. Cada um é baixado uma vez e depois funciona offline."
  ja: "大きいモデルほど精度は高く、処理は遅くなります。各モデルは一度だけダウンロードされ、その後はオフラインで動作します。"
  zh-CN: "模型越大越准确，但也越慢。每个模型只需下载一次，之后即可离线使用。"
  ko: "큰 모델일수록 더 정확하지만 느립니다. 각 모델은 한 번만 다운로드하면 이후 오프라인으로 작동합니다."

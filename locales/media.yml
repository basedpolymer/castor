audio.denoise.opt.method.help:
  en: "Voice uses a small neural network made for speech. General suits steady noise on any sound."
  fr: "Voix utilise un petit réseau neuronal fait pour la parole. Général convient aux bruits constants sur tout son."
  de: "„Stimme“ nutzt ein kleines, für Sprache gemachtes neuronales Netz. „Allgemein“ eignet sich für gleichmäßiges Rauschen in jedem Ton."
  es: "«Voz» usa una pequeña red neuronal hecha para el habla. «General» sirve para ruido constante en cualquier sonido."
  it: "«Voce» usa una piccola rete neurale pensata per il parlato. «Generale» va bene per rumori costanti su qualsiasi suono."
  pt-BR: "“Voz” usa uma pequena rede neural feita para fala. “Geral” serve para ruído constante em qualquer som."
  ja: "「音声」は話し声向けの小さなニューラルネットワークを使います。「汎用」はどんな音でも一定のノイズに向いています。"
  zh-CN: "“人声”使用专为语音设计的小型神经网络。“通用”适合处理任何声音中的稳定噪声。"
  ko: "'음성'은 말소리용 소형 신경망을 사용합니다. '일반'은 어떤 소리든 일정한 소음에 알맞습니다."

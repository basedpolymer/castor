files.identify.opt.fix_extensions.help:
  en: Renames binary files whose extension is missing or wrong (undoable). Text files keep theirs.
  fr: Renomme les fichiers binaires sans extension ou avec une mauvaise (annulable). Les fichiers texte gardent la leur.
  de: "Benennt Binärdateien um, deren Erweiterung fehlt oder falsch ist (rückgängig zu machen). Textdateien behalten ihre."
  es: "Renombra los archivos binarios cuya extensión falta o es incorrecta (reversible). Los archivos de texto conservan la suya."
  it: "Rinomina i file binari con estensione mancante o errata (annullabile). I file di testo mantengono la loro."
  pt-BR: "Renomeia arquivos binários com extensão ausente ou errada (reversível). Arquivos de texto mantêm a deles."
  ja: "拡張子がない、または誤っているバイナリファイルの名前を変更します (元に戻せます)。テキストファイルはそのままです。"
  zh-CN: "重命名扩展名缺失或有误的二进制文件（可撤销）。文本文件保持不变。"
  ko: "확장자가 없거나 잘못된 바이너리 파일의 이름을 바꿉니다(되돌릴 수 있음). 텍스트 파일은 그대로 둡니다."
files.identify.opt.min_confidence:

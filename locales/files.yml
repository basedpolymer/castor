files.extract.err.rar:
  en: RAR archives are not supported (no free RAR decoder is compatible with Castor’s GPL licence). 7-Zip can open them.
  fr: Les archives RAR ne sont pas prises en charge (aucun décodeur RAR libre n’est compatible avec la licence GPL de Castor). 7-Zip sait les ouvrir.
  de: "RAR-Archive werden nicht unterstützt (kein freier RAR-Decoder ist mit der GPL-Lizenz von Castor kompatibel). 7-Zip kann sie öffnen."
  es: "Los archivos RAR no son compatibles (ningún decodificador RAR libre es compatible con la licencia GPL de Castor). 7-Zip puede abrirlos."
  it: "Gli archivi RAR non sono supportati (nessun decodificatore RAR libero è compatibile con la licenza GPL di Castor). 7-Zip può aprirli."
  pt-BR: "Arquivos RAR não são compatíveis (nenhum decodificador RAR livre é compatível com a licença GPL do Castor). O 7-Zip consegue abri-los."
  ja: "RAR アーカイブには対応していません (Castor の GPL ライセンスと両立する無料の RAR デコーダーがないため)。7-Zip で開けます。"
  zh-CN: "不支持 RAR 压缩包（没有与 Castor 的 GPL 许可证兼容的免费 RAR 解码器）。可使用 7-Zip 打开。"
  ko: "RAR 압축 파일은 지원하지 않습니다(Castor의 GPL 라이선스와 호환되는 무료 RAR 디코더가 없습니다). 7-Zip으로 열 수 있습니다."

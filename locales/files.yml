  ko: "처리할 파일이 없습니다."
files.err.exists:
  en: "“%{name}” already exists; nothing was overwritten."
  fr: "« %{name} » existe déjà ; rien n’a été écrasé."
  de: "„%{name}“ existiert bereits; nichts wurde überschrieben."
  es: "“%{name}” ya existe; no se ha sobrescrito nada."
  it: "“%{name}” esiste già; non è stato sovrascritto nulla."
  pt-BR: "“%{name}” já existe; nada foi substituído."
  ja: "「%{name}」はすでに存在します。何も上書きされていません。"
  zh-CN: "“%{name}”已存在；未覆盖任何内容。"
  ko: "“%{name}”은(는) 이미 있습니다. 아무것도 덮어쓰지 않았습니다."
files.err.duplicate_target:
  en: "Two files would both be named “%{name}”. Add a number ({n}) to the pattern."
  fr: "Deux fichiers s’appelleraient « %{name} ». Ajoutez un numéro ({n}) au modèle."
  de: "Zwei Dateien würden beide „%{name}“ heißen. Fügen Sie dem Muster eine Nummer ({n}) hinzu."
  es: "Dos archivos se llamarían “%{name}”. Añade un número ({n}) al patrón."
  it: "Due file si chiamerebbero entrambi “%{name}”. Aggiungi un numero ({n}) al modello."
  pt-BR: "Dois arquivos se chamariam “%{name}”. Adicione um número ({n}) ao padrão."
  ja: "2 つのファイルがどちらも「%{name}」という名前になります。パターンに番号 ({n}) を加えてください。"
  zh-CN: "两个文件都会命名为“%{name}”。请在模式中加入编号 ({n})。"
  ko: "두 파일의 이름이 모두 “%{name}”이(가) 됩니다. 패턴에 번호({n})를 추가하세요."
files.err.gone:
  en: moved or deleted since
  fr: déplacé ou supprimé depuis

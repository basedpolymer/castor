files.archive.opt.zstd.help:
  en: Faster and smaller, but older unzip tools (and Windows Explorer) cannot open it.
  fr: Plus rapide et plus petit, mais les anciens outils (et l’Explorateur Windows) ne savent pas l’ouvrir.
  de: "Schneller und kleiner, aber ältere Entpackprogramme (und der Windows-Explorer) können es nicht öffnen."
  es: "Más rápido y pequeño, pero las herramientas unzip antiguas (y el Explorador de Windows) no pueden abrirlo."
  it: "Più veloce e più piccolo, ma i vecchi programmi unzip (e Esplora file di Windows) non riescono ad aprirlo."
  pt-BR: "Mais rápido e menor, mas ferramentas unzip antigas (e o Explorador de Arquivos do Windows) não conseguem abri-lo."
  ja: "高速で小さくなりますが、古い unzip ツール (および Windows のエクスプローラー) では開けません。"
  zh-CN: "更快更小，但旧版解压工具（以及 Windows 资源管理器）无法打开。"
  ko: "더 빠르고 작아지지만, 오래된 unzip 도구와 Windows 탐색기에서는 열 수 없습니다."
files.archive.opt.password.help:
  en: "AES-256 (ZIP and 7z; 7z also hides the file names). Windows Explorer cannot open AES ZIPs: use 7-Zip or Castor."
  fr: "AES-256 (ZIP et 7z ; le 7z masque aussi les noms). L’Explorateur Windows n’ouvre pas les ZIP AES : utilisez 7-Zip ou Castor."
  de: "AES-256 (ZIP und 7z; 7z verbirgt auch die Dateinamen). Der Windows-Explorer kann AES-ZIPs nicht öffnen: nutzen Sie 7-Zip oder Castor."
  es: "AES-256 (ZIP y 7z; 7z también oculta los nombres de archivo). El Explorador de Windows no puede abrir ZIP con AES: usa 7-Zip o Castor."
  it: "AES-256 (ZIP e 7z; 7z nasconde anche i nomi dei file). Esplora file di Windows non apre gli ZIP con AES: usa 7-Zip o Castor."
  pt-BR: "AES-256 (ZIP e 7z; o 7z também oculta os nomes dos arquivos). O Explorador de Arquivos do Windows não abre ZIPs com AES: use 7-Zip ou Castor."
  ja: "AES-256 (ZIP と 7z。7z ではファイル名も隠せます)。Windows のエクスプローラーでは AES の ZIP を開けません。7-Zip か Castor を使ってください。"
  zh-CN: "AES-256（ZIP 和 7z；7z 还会隐藏文件名）。Windows 资源管理器无法打开 AES 加密的 ZIP，请使用 7-Zip 或 Castor。"
  ko: "AES-256 (ZIP, 7z. 7z는 파일 이름도 숨깁니다). Windows 탐색기에서는 AES ZIP을 열 수 없으니 7-Zip이나 Castor를 사용하세요."

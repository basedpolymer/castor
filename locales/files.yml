# ------------------------------------------------------------------ Archive
files.archive.name:
  en: Create archive
  fr: Créer une archive
files.archive.desc:
  en: ZIP, 7z or TAR archives, with an optional AES-256 password, exclusions and split volumes.
  fr: Archives ZIP, 7z ou TAR, avec mot de passe AES-256 en option, exclusions et découpage en volumes.
files.archive.verb:
  en: Create archive
  fr: Créer l’archive
files.archive.keywords:
  en: zip compress archive 7z tar gz zstd password encrypt split backup folder
  fr: zip compresser archive 7z tar gz zstd mot de passe chiffrer découper sauvegarde dossier
files.archive.note:
  en: "%{files} files · %{before} → %{after} (%{change})"
  fr: "%{files} fichiers · %{before} → %{after} (%{change})"
files.archive.default_name:
  en: archive
  fr: archive
files.archive.opt.format:
  en: Format
  fr: Format
files.archive.opt.level:
  en: Compression
  fr: Compression
files.archive.opt.level.store:
  en: None
  fr: Aucune
files.archive.opt.level.fast:
  en: Fast
  fr: Rapide
files.archive.opt.level.normal:
  en: Normal
  fr: Normale
files.archive.opt.level.max:
  en: Maximum
  fr: Maximale
files.archive.opt.zstd:
  en: Zstandard inside the ZIP
  fr: Zstandard dans le ZIP
files.archive.opt.zstd.help:
  en: Faster and smaller, but older unzip tools (and Windows Explorer) cannot open it.
  fr: Plus rapide et plus petit, mais les anciens outils (et l’Explorateur Windows) ne savent pas l’ouvrir.
files.archive.opt.password.help:
  en: "AES-256 (ZIP and 7z; 7z also hides the file names). Windows Explorer cannot open AES ZIPs: use 7-Zip or Castor."
  fr: "AES-256 (ZIP et 7z ; le 7z masque aussi les noms). L’Explorateur Windows n’ouvre pas les ZIP AES : utilisez 7-Zip ou Castor."
files.archive.opt.name:
  en: Archive name
  fr: Nom de l’archive
files.archive.opt.name.help:
  en: Empty = the folder’s name.
  fr: Vide = le nom du dossier.
files.archive.opt.each:
  en: One archive per item
  fr: Une archive par élément
files.archive.opt.exclude:
  en: Leave out
  fr: Exclure
files.archive.opt.exclude.help:
  en: "Name patterns separated by commas: *.tmp, node_modules"
  fr: "Motifs de noms séparés par des virgules : *.tmp, node_modules"
files.archive.opt.split_mb:
  en: Split into parts of
  fr: Découper en parties de
files.archive.opt.split_mb.help:
  en: 0 = one file. Parts are named .001, .002… and open in 7-Zip or Castor.
  fr: 0 = un seul fichier. Les parties s’appellent .001, .002… et s’ouvrent avec 7-Zip ou Castor.
files.archive.err.password_format:
  en: Passwords work with ZIP and 7z only.
  fr: Les mots de passe ne fonctionnent qu’avec ZIP et 7z.
files.archive.err.empty:
  en: Nothing to archive (everything was excluded or the folders are empty).
  fr: Rien à archiver (tout est exclu ou les dossiers sont vides).

# ------------------------------------------------------------------ Extract
files.extract.name:
  en: Extract archive
  fr: Extraire une archive
files.extract.desc:
  en: Open ZIP, 7z and TAR archives (also password-protected and split), safely, into a folder.
  fr: Ouvrez les archives ZIP, 7z et TAR (même protégées ou découpées), en toute sécurité, dans un dossier.
files.extract.verb:
  en: Extract
  fr: Extraire
files.extract.keywords:
  en: unzip extract decompress zip 7z tar gz bz2 xz zstd open archive uncompress
  fr: dézipper extraire décompresser zip 7z tar gz bz2 xz zstd ouvrir archive
files.extract.note:
  en: "%{count} files · %{size}"
  fr: "%{count} fichiers · %{size}"
files.extract.opt.password.help:
  en: Only for protected archives. Never kept in history.
  fr: Seulement pour les archives protégées. Jamais conservé dans l’historique.
files.extract.opt.smart_folder:
  en: No folder inside a folder
  fr: Pas de dossier dans un dossier
files.extract.opt.smart_folder.help:
  en: When the archive holds a single folder, use it directly.
  fr: Si l’archive contient un seul dossier, l’utiliser directement.
files.extract.opt.keep_dates:
  en: Keep the files’ dates
  fr: Conserver les dates des fichiers
files.extract.err.no_archive:
  en: Drop an archive (ZIP, 7z, TAR…).
  fr: Déposez une archive (ZIP, 7z, TAR…).
files.extract.err.unknown:
  en: This is not an archive Castor can open (ZIP, 7z, TAR, GZ, BZ2, XZ, ZST).
  fr: Ce n’est pas une archive que Castor sait ouvrir (ZIP, 7z, TAR, GZ, BZ2, XZ, ZST).
files.extract.err.rar:
  en: RAR archives are not supported (no free RAR decoder is compatible with Castor’s GPL licence). 7-Zip can open them.
  fr: Les archives RAR ne sont pas prises en charge (aucun décodeur RAR libre n’est compatible avec la licence GPL de Castor). 7-Zip sait les ouvrir.
files.extract.err.corrupt:
  en: The archive is damaged or incomplete
  fr: L’archive est endommagée ou incomplète
files.extract.err.empty:
  en: The archive is empty (0 bytes).
  fr: L’archive est vide (0 octet).
files.extract.err.password_needed:
  en: This archive is protected — enter its password.
  fr: Cette archive est protégée — saisissez son mot de passe.
files.extract.err.password_wrong:
  en: Wrong password.
  fr: Mot de passe incorrect.

# ------------------------------------------------------------------ Dates
files.dates.name:
  en: Change file dates
  fr: Modifier les dates
files.dates.desc:
  en: Set created and modified dates to the photo’s capture date, to a date of your choice, or shift them.
  fr: Réglez les dates de création et de modification sur la prise de vue, sur une date choisie, ou décalez-les.

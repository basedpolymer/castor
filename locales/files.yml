  ko: "정렬 및 분류"
files.sort.desc:
  en: Tidy files into folders by type, year, month, camera, size or your own rules — every move undoable.
  fr: Rangez les fichiers dans des dossiers par type, année, mois, appareil, taille ou vos règles — chaque déplacement s’annule.
  de: "Dateien nach Typ, Jahr, Monat, Kamera, Größe oder eigenen Regeln in Ordner einsortieren – jede Verschiebung ist rückgängig zu machen."
  es: "Ordena archivos en carpetas por tipo, año, mes, cámara, tamaño o tus propias reglas; cada movimiento se puede deshacer."
  it: "Metti in ordine i file in cartelle per tipo, anno, mese, fotocamera, dimensione o con regole tue; ogni spostamento è annullabile."
  pt-BR: "Organize arquivos em pastas por tipo, ano, mês, câmera, tamanho ou suas próprias regras; cada movimentação pode ser desfeita."
  ja: "ファイルを種類、年、月、カメラ、サイズ、独自のルールでフォルダに整理。すべての移動を元に戻せます。"
  zh-CN: "按类型、年份、月份、相机、大小或自定义规则把文件整理到文件夹，每次移动都可撤销。"
  ko: "파일을 형식, 연도, 월, 카메라, 크기 또는 직접 만든 규칙에 따라 폴더로 정리합니다. 모든 이동은 되돌릴 수 있습니다."

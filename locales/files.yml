files.metadata.opt.title.help:
  en: Empty fields are left as they are.
  fr: Les champs vides restent inchangés.
  de: "Leere Felder bleiben unverändert."
  es: "Los campos vacíos se dejan como están."
  it: "I campi vuoti restano invariati."
  pt-BR: "Campos vazios são mantidos como estão."
  ja: "空欄の項目は変更されません。"
  zh-CN: "留空的字段保持不变。"
  ko: "비워 둔 항목은 그대로 유지됩니다."
files.metadata.err.nothing:
  en: Fill in at least one field to change.
  fr: Remplissez au moins un champ à modifier.
  de: "Füllen Sie mindestens ein zu änderndes Feld aus."
  es: "Rellena al menos un campo para cambiar."
  it: "Compila almeno un campo da modificare."
  pt-BR: "Preencha pelo menos um campo para alterar."
  ja: "変更する項目を少なくとも 1 つ入力してください。"
  zh-CN: "请至少填写一个要更改的字段。"
  ko: "변경할 항목을 하나 이상 입력하세요."
files.metadata.err.read:

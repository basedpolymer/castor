files.sort.opt.rules.help:
  en: "One per line: patterns => folder. The first match wins. Tokens in folders: {year} {month} {ext} {type} {camera}."
  fr: "Une par ligne : motifs => dossier. La première qui correspond s’applique. Jetons : {year} {month} {ext} {type} {camera}."
  de: "Eine pro Zeile: Muster => Ordner. Der erste Treffer gilt. Platzhalter in Ordnern: {year} {month} {ext} {type} {camera}."
  es: "Una por línea: patrones => carpeta. Gana la primera coincidencia. Marcadores en carpetas: {year} {month} {ext} {type} {camera}."
  it: "Una per riga: modelli => cartella. Vale la prima corrispondenza. Segnaposto nelle cartelle: {year} {month} {ext} {type} {camera}."
  pt-BR: "Uma por linha: padrões => pasta. A primeira correspondência vale. Marcadores nas pastas: {year} {month} {ext} {type} {camera}."
  ja: "1 行に 1 つ: パターン => フォルダ。最初に一致したものが適用されます。フォルダ内のトークン: {year} {month} {ext} {type} {camera}。"
  zh-CN: "每行一条：模式 => 文件夹。以第一个匹配为准。文件夹中可用标记：{year} {month} {ext} {type} {camera}。"
  ko: "한 줄에 하나씩: 패턴 => 폴더. 처음 일치한 규칙이 적용됩니다. 폴더에 쓸 수 있는 토큰: {year} {month} {ext} {type} {camera}."

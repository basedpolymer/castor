files.dates.name:
  en: Change file dates
  fr: Modifier les dates
  de: "Dateidaten ändern"
  es: "Cambiar fechas de archivos"
  it: "Cambia date dei file"
  pt-BR: "Alterar datas dos arquivos"
  ja: "ファイルの日付を変更"
  zh-CN: "更改文件日期"
  ko: "파일 날짜 변경"
files.dates.desc:
  en: Set created and modified dates to the photo’s capture date, to a date of your choice, or shift them.
  fr: Réglez les dates de création et de modification sur la prise de vue, sur une date choisie, ou décalez-les.
  de: "Erstellungs- und Änderungsdatum auf das Aufnahmedatum des Fotos, ein frei gewähltes Datum setzen oder verschieben."
  es: "Fija las fechas de creación y modificación a la de captura de la foto, a una fecha a tu elección, o desplázalas."
  it: "Imposta le date di creazione e modifica sulla data di scatto della foto, su una data a scelta, oppure spostale."
  pt-BR: "Defina as datas de criação e modificação como a data da foto, uma data à sua escolha, ou desloque-as."
  ja: "作成日時と更新日時を写真の撮影日時や任意の日時に設定したり、ずらしたりできます。"
  zh-CN: "将创建和修改日期设为照片的拍摄日期或自选日期，或整体偏移。"
  ko: "만든 날짜와 수정한 날짜를 사진의 촬영 날짜나 원하는 날짜로 설정하거나 일정 시간만큼 옮깁니다."

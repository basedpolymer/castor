files.extract.err.unknown:
  en: This is not an archive Castor can open (ZIP, 7z, TAR, GZ, BZ2, XZ, ZST).
  fr: Ce n’est pas une archive que Castor sait ouvrir (ZIP, 7z, TAR, GZ, BZ2, XZ, ZST).

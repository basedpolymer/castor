# ------------------------------------------------------------------ Duplicates
files.duplicates.name:
  en: Find duplicates
  fr: Trouver les doublons
files.duplicates.desc:
  en: Find identical files byte for byte, see how much space they waste, set the copies aside — never deleted.
  fr: Trouvez les fichiers identiques octet par octet, voyez la place perdue, mettez les copies de côté — jamais supprimées.

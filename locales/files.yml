files.checksum.desc:
  en: SHA-256 fingerprints to prove a file arrived intact.
  fr: Empreintes SHA-256 pour prouver qu’un fichier est arrivé intact.
  de: "SHA-256-Fingerabdrücke, die beweisen, dass eine Datei unversehrt angekommen ist."
  es: "Huellas SHA-256 para comprobar que un archivo llegó intacto."
  it: "Impronte SHA-256 per dimostrare che un file è arrivato intatto."
  pt-BR: "Impressões digitais SHA-256 para provar que um arquivo chegou intacto."
  ja: "ファイルが壊れずに届いたことを SHA-256 のフィンガープリントで確認します。"
  zh-CN: "用 SHA-256 指纹证明文件完整无损地到达。"
  ko: "SHA-256 지문으로 파일이 손상 없이 도착했는지 확인합니다."
files.checksum.keywords:
  en: hash fingerprint verify integrity
  fr: empreinte hachage vérifier intégrité somme
  de: "hash fingerabdruck prüfen integrität prüfsumme"
  es: "hash huella verificar integridad suma comprobación"

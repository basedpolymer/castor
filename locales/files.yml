files.rename.opt.pattern.help:
  en: "Tokens: {name} {n} {n:03} {date:%Y-%m-%d} {created} {exif.date} {exif.camera} {parent} {ext} {size}. The extension is added for you."
  fr: "Jetons : {name} {n} {n:03} {date:%Y-%m-%d} {created} {exif.date} {exif.camera} {parent} {ext} {size}. L’extension est ajoutée automatiquement."
  de: "Platzhalter: {name} {n} {n:03} {date:%Y-%m-%d} {created} {exif.date} {exif.camera} {parent} {ext} {size}. Die Erweiterung wird automatisch ergänzt."
  es: "Marcadores: {name} {n} {n:03} {date:%Y-%m-%d} {created} {exif.date} {exif.camera} {parent} {ext} {size}. La extensión se añade sola."
  it: "Segnaposto: {name} {n} {n:03} {date:%Y-%m-%d} {created} {exif.date} {exif.camera} {parent} {ext} {size}. L’estensione viene aggiunta in automatico."
  pt-BR: "Marcadores: {name} {n} {n:03} {date:%Y-%m-%d} {created} {exif.date} {exif.camera} {parent} {ext} {size}. A extensão é adicionada automaticamente."
  ja: "トークン: {name} {n} {n:03} {date:%Y-%m-%d} {created} {exif.date} {exif.camera} {parent} {ext} {size}。拡張子は自動で付きます。"
  zh-CN: "可用标记：{name} {n} {n:03} {date:%Y-%m-%d} {created} {exif.date} {exif.camera} {parent} {ext} {size}。扩展名会自动添加。"
  ko: "토큰: {name} {n} {n:03} {date:%Y-%m-%d} {created} {exif.date} {exif.camera} {parent} {ext} {size}. 확장자는 자동으로 붙습니다."

  en: Date and time
  fr: Date et heure
files.dates.opt.date.help:
  en: "e.g. 2026-11-06 or 2026-11-06 19:30 (local time)"
  fr: "p. ex. 2026-11-06 ou 2026-11-06 19:30 (heure locale)"
files.dates.opt.shift_days:
  en: Days
  fr: Jours
files.dates.opt.shift_hours:
  en: Hours
  fr: Heures
files.dates.opt.shift_hours.help:
  en: Handy for a camera left on the wrong time zone.

  fr: Confiance minimale pour renommer
  de: "Mindestsicherheit zum Umbenennen"
  es: "Confianza mínima para renombrar"
  it: "Affidabilità minima per rinominare"
  pt-BR: "Confiança mínima para renomear"
  ja: "名前変更に必要な最小信頼度"
  zh-CN: "重命名所需的最低可信度"
  ko: "이름을 바꿀 최소 신뢰도"
files.identify.err.nothing:
  en: Nothing to report; choose a report format or “Fix the extensions”.
  fr: Rien à produire ; choisissez un format de rapport ou « Corriger les extensions ».
  de: "Nichts zu melden; wählen Sie ein Berichtsformat oder „Erweiterungen korrigieren“."
  es: "Nada que informar; elige un formato de informe o “Corregir las extensiones”."
  it: "Niente da segnalare; scegli un formato di rapporto o “Correggi le estensioni”."
  pt-BR: "Nada a informar; escolha um formato de relatório ou “Corrigir as extensões”."
  ja: "報告する内容がありません。レポート形式か「拡張子を修正」を選んでください。"
  zh-CN: "没有可报告的内容；请选择报告格式或“修正扩展名”。"
  ko: "보고할 내용이 없습니다. 보고서 형식이나 “확장자 수정”을 선택하세요."

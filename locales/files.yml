# ------------------------------------------------------------------ Duplicates
files.duplicates.name:
  en: Find duplicates
  fr: Trouver les doublons
  de: "Duplikate finden"
  es: "Buscar duplicados"
  it: "Trova duplicati"
  pt-BR: "Encontrar duplicados"
  ja: "重複ファイルを検索"
  zh-CN: "查找重复文件"
  ko: "중복 파일 찾기"
files.duplicates.desc:
  en: Find identical files byte for byte, see how much space they waste, set the copies aside — never deleted.
  fr: Trouvez les fichiers identiques octet par octet, voyez la place perdue, mettez les copies de côté — jamais supprimées.
  de: "Findet byteidentische Dateien, zeigt den verschwendeten Speicherplatz und legt die Kopien beiseite – nichts wird gelöscht."
  es: "Encuentra archivos idénticos byte a byte, muestra cuánto espacio desperdician y aparta las copias; nunca se elimina nada."
  it: "Trova file identici byte per byte, mostra quanto spazio sprecano e mette da parte le copie: non viene mai eliminato nulla."
  pt-BR: "Encontre arquivos idênticos byte a byte, veja quanto espaço desperdiçam e separe as cópias; nada é excluído."
  ja: "バイト単位で同一のファイルを探し、無駄な容量を確認して、コピーを別の場所に退避します。削除はしません。"
  zh-CN: "查找逐字节相同的文件，查看浪费的空间，并把副本单独存放，绝不删除。"
  ko: "바이트 단위로 동일한 파일을 찾아 낭비되는 공간을 보여 주고 복사본을 따로 옮깁니다. 삭제는 하지 않습니다."
files.duplicates.verb:
  en: Find duplicates
  fr: Chercher
  de: "Duplikate finden"
  es: "Buscar duplicados"
  it: "Trova duplicati"
  pt-BR: "Encontrar duplicados"
  ja: "重複を検索"
  zh-CN: "查找重复"
  ko: "중복 찾기"
files.duplicates.keywords:

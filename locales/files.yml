  en: "%{count} without a date, left as they were"
  fr: "%{count} sans date, laissés tels quels"
files.dates.failed:
  en: "%{count} could not be changed"
  fr: "%{count} n’ont pas pu être modifiés"
files.dates.opt.mode:
  en: New date
  fr: Nouvelle date
files.dates.opt.mode.capture:
  en: Date taken (EXIF / video)
  fr: Date de prise de vue (EXIF / vidéo)
files.dates.opt.mode.set:
  en: A date I choose
  fr: Une date choisie
files.dates.opt.mode.shift:
  en: Shift by…
  fr: Décaler de…
files.dates.opt.mode.modified_to_created:

files.dates.opt.shift_minutes:
  en: Minutes
  fr: Minutes
files.dates.opt.which:
  en: Dates to change
  fr: Dates à modifier
files.dates.opt.which.both:
  en: Created and modified
  fr: Création et modification
files.dates.opt.which.modified:
  en: Modified only
  fr: Modification seulement
files.dates.opt.which.created:
  en: Created only
  fr: Création seulement
files.dates.opt.recursive:
  en: Include subfolders
  fr: Inclure les sous-dossiers
files.dates.err.date:
  en: "“%{value}” is not a date. Use 2026-11-06 or 2026-11-06 19:30."
  fr: "« %{value} » n’est pas une date. Utilisez 2026-11-06 ou 2026-11-06 19:30."
files.dates.err.zero:
  en: Set a shift (days, hours or minutes).
  fr: Indiquez un décalage (jours, heures ou minutes).
files.dates.err.nothing:
  en: None of these files has a date to apply.
  fr: Aucun de ces fichiers n’a de date à appliquer.


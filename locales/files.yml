  ko: "메타데이터를 읽을 수 없습니다"
files.metadata.err.unsupported:
  en: This format cannot hold tags.
  fr: Ce format ne peut pas contenir de tags.
  de: "Dieses Format kann keine Tags enthalten."
  es: "Este formato no admite etiquetas."
  it: "Questo formato non può contenere tag."
  pt-BR: "Este formato não suporta tags."
  ja: "この形式にはタグを保存できません。"
  zh-CN: "此格式不支持标签。"
  ko: "이 형식은 태그를 저장할 수 없습니다."
files.metadata.err.image_edit:
  en: To write titles and keywords into photos, use the SEO image tool; here photos can be viewed or stripped.
  fr: Pour écrire titres et mots-clés dans des photos, utilisez l’outil Image SEO ; ici, les photos peuvent être consultées ou nettoyées.
  de: "Um Titel und Stichwörter in Fotos zu schreiben, nutzen Sie das SEO-Bild-Werkzeug; hier lassen sich Fotos nur ansehen oder bereinigen."
  es: "Para escribir títulos y palabras clave en fotos, usa la herramienta de imágenes SEO; aquí las fotos solo se pueden ver o limpiar."
  it: "Per scrivere titoli e parole chiave nelle foto usa lo strumento immagini SEO; qui le foto si possono solo visualizzare o ripulire."
  pt-BR: "Para gravar títulos e palavras-chave em fotos, use a ferramenta de imagem SEO; aqui as fotos só podem ser vistas ou limpas."
  ja: "写真にタイトルやキーワードを書き込むには SEO 画像ツールを使ってください。ここでは写真の表示と削除のみ行えます。"
  zh-CN: "若要向照片写入标题和关键词，请使用 SEO 图片工具；此处只能查看或清除照片的元数据。"
  ko: "사진에 제목과 키워드를 기록하려면 SEO 이미지 도구를 사용하세요. 여기서는 사진을 보거나 메타데이터를 제거할 수만 있습니다."
files.metadata.err.image_format:
  en: Lossless removal works for JPEG, PNG and WebP; for other formats use “Strip metadata” in the image tools.
  fr: La suppression sans perte fonctionne pour JPEG, PNG et WebP ; pour les autres formats, utilisez « Supprimer les métadonnées » des outils d’image.
  de: "Die verlustfreie Entfernung funktioniert bei JPEG, PNG und WebP; für andere Formate nutzen Sie „Metadaten entfernen“ in den Bildwerkzeugen."
  es: "La eliminación sin pérdida funciona con JPEG, PNG y WebP; para otros formatos usa “Quitar metadatos” en las herramientas de imagen."
  it: "La rimozione senza perdita funziona con JPEG, PNG e WebP; per gli altri formati usa “Rimuovi metadati” negli strumenti per immagini."
  pt-BR: "A remoção sem perdas funciona com JPEG, PNG e WebP; para outros formatos use “Remover metadados” nas ferramentas de imagem."
  ja: "ロスレスでの削除は JPEG、PNG、WebP で行えます。他の形式は画像ツールの「メタデータを削除」を使ってください。"
  zh-CN: "无损删除适用于 JPEG、PNG 和 WebP；其他格式请使用图片工具中的“删除元数据”。"
  ko: "무손실 제거는 JPEG, PNG, WebP에서 가능합니다. 다른 형식은 이미지 도구의 “메타데이터 제거”를 사용하세요."
files.metadata.err.corrupt:
  en: The file is damaged.
  fr: Le fichier est endommagé.
  de: "Die Datei ist beschädigt."
  es: "El archivo está dañado."
  it: "Il file è danneggiato."
  pt-BR: "O arquivo está danificado."
  ja: "ファイルが破損しています。"
  zh-CN: "文件已损坏。"
  ko: "파일이 손상되었습니다."

files.identify.name:
  en: What is this file?
  fr: Quel est ce fichier ?
  de: "Was ist diese Datei?"
  es: "¿Qué es este archivo?"
  it: "Che file è questo?"
  pt-BR: "Que arquivo é este?"
  ja: "このファイルは何？"
  zh-CN: "这是什么文件？"
  ko: "이 파일은 무엇일까요?"
files.identify.desc:
  en: Find the real type of files with no or wrong extensions — 200+ types, with confidence — and fix them.
  fr: Trouvez le vrai type des fichiers sans extension ou mal nommés — plus de 200 types, avec indice de confiance — et corrigez-les.
  de: "Erkennt den echten Typ von Dateien ohne oder mit falscher Erweiterung – über 200 Typen, mit Trefferwahrscheinlichkeit – und korrigiert sie."
  es: "Descubre el tipo real de archivos sin extensión o con una incorrecta (más de 200 tipos, con grado de confianza) y los corrige."
  it: "Scopri il vero tipo dei file senza estensione o con estensione errata (oltre 200 tipi, con grado di affidabilità) e correggili."
  pt-BR: "Descubra o tipo real de arquivos sem extensão ou com extensão errada (mais de 200 tipos, com grau de confiança) e corrija-os."
  ja: "拡張子がない、または間違っているファイルの本当の種類を判定し (200 種類以上、信頼度つき)、修正します。"
  zh-CN: "识别无扩展名或扩展名有误的文件的真实类型（200 多种，附可信度），并加以修正。"
  ko: "확장자가 없거나 잘못된 파일의 실제 형식을 신뢰도와 함께 알아내고(200종 이상) 바로잡습니다."

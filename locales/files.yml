# ------------------------------------------------------------------ Rename
files.rename.name:
  en: Batch rename
  fr: Renommer en lot
  de: "Stapelumbenennung"
  es: "Renombrar en lote"
  it: "Rinomina in blocco"
  pt-BR: "Renomear em lote"
  ja: "一括名前変更"
  zh-CN: "批量重命名"
  ko: "일괄 이름 바꾸기"
files.rename.desc:
  en: Rename many files at once with patterns, numbers, dates and find & replace — previewed, undoable.
  fr: Renommez des centaines de fichiers d’un coup avec modèles, numéros, dates et rechercher-remplacer — aperçu et annulation.
  de: "Viele Dateien auf einmal umbenennen – mit Mustern, Nummern, Datumsangaben und Suchen & Ersetzen, mit Vorschau und rückgängig machbar."
  es: "Renombra muchos archivos a la vez con patrones, números, fechas y buscar y reemplazar, con vista previa y reversible."
  it: "Rinomina molti file in una volta con modelli, numeri, date e trova e sostituisci, con anteprima e annullabile."
  pt-BR: "Renomeie vários arquivos de uma vez com padrões, números, datas e localizar e substituir, com pré-visualização e reversível."
  ja: "パターン、連番、日付、検索と置換で多数のファイルを一度に名前変更。プレビュー付きで元に戻せます。"
  zh-CN: "用模式、编号、日期以及查找替换一次重命名多个文件，可预览，可撤销。"
  ko: "패턴, 번호, 날짜, 찾아 바꾸기로 많은 파일의 이름을 한 번에 바꿉니다. 미리 보기와 실행 취소를 지원합니다."
files.rename.verb:
  en: Rename
  fr: Renommer
  de: "Umbenennen"
  es: "Renombrar"
  it: "Rinomina"
  pt-BR: "Renomear"
  ja: "名前を変更"
  zh-CN: "重命名"
  ko: "이름 바꾸기"
files.rename.keywords:
  en: rename batch bulk names numbering sequence regex replace exif date case
  fr: renommer lot masse noms numérotation séquence regex remplacer exif date casse
  de: "umbenennen stapel massen namen nummerierung reihenfolge regex ersetzen exif datum groß-kleinschreibung"
  es: "renombrar lote masa nombres numeración secuencia regex reemplazar exif fecha mayúsculas"
  it: "rinominare blocco massa nomi numerazione sequenza regex sostituire exif data maiuscole"
  pt-BR: "renomear lote massa nomes numeração sequência regex substituir exif data maiúsculas"
  ja: "名前変更 一括 リネーム 連番 正規表現 置換 exif 日付 大文字小文字"
  zh-CN: "重命名 批量 名称 编号 序号 正则 替换 exif 日期 大小写"
  ko: "이름 바꾸기 일괄 리네임 번호 순번 정규식 바꾸기 exif 날짜 대소문자"

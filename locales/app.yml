  pt-BR: "O texto, as imagens e os desenhos sob as %{count} caixas pretas serão excluídos do arquivo salvo. Não será possível recuperá-los dele."
  ja: "%{count} 個の黒い範囲の下にあるテキスト、画像、図形は、保存したファイルから削除されます。そのファイルからは復元できません。"
  zh-CN: "%{count} 个黑色方框下的文字、图片和图形将从保存的文件中删除，且无法从该文件中恢复。"
  ko: "검은 상자 %{count}개 아래의 텍스트, 이미지, 그림이 저장된 파일에서 삭제됩니다. 해당 파일에서는 복구할 수 없습니다."


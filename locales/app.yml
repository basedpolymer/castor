app.studio.pdf.name:
  en: PDF Studio
  fr: Studio PDF

app.studio.pdf.desc:
  en: Open one PDF and work on its pages directly — reorder, annotate, sign, black out, fill in.
  fr: Ouvrez un PDF et travaillez directement sur ses pages — réordonner, annoter, signer, caviarder, remplir.

app.studio.pdf.features:
  en: "Organize: drag pages, rotate, delete, insert from another PDF, extract a selection. Annotate: highlight, underline, pen, boxes, arrows, text, comments. Sign: draw, type or import a signature. Redact: boxes or found text, truly removed on save. Forms: type into the fields."
  fr: "Organiser : glisser les pages, pivoter, supprimer, insérer depuis un autre PDF, extraire une sélection. Annoter : surligner, souligner, stylo, cadres, flèches, texte, commentaires. Signer : dessiner, taper ou importer une signature. Caviarder : cadres ou texte trouvé, vraiment supprimés à l’enregistrement. Formulaires : saisir dans les champs."


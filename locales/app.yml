app.ws.prefill_help:
  en: "Pre-filled by option name: logo, color (first colour), accent (second), colors, signature. Results go to the output folder, in a sub-folder per tool and day."
  fr: "Pré-rempli selon le nom de l’option : logo, color (première couleur), accent (seconde), colors, signature. Les résultats vont dans le dossier de sortie, dans un sous-dossier par outil et par jour."
app.integration.open_in:
  en: Open in Castor
  fr: Ouvrir dans Castor
app.integration.explorer:
  en: Explorer menu
  fr: Menu de l’Explorateur
app.integration.explorer_help:
  en: Right-click files → Castor → Open in Castor or one of your favourite tools. On Windows 11 it is under “Show more options”.
  fr: Clic droit sur des fichiers → Castor → Ouvrir dans Castor ou l’un de vos outils favoris. Sous Windows 11, il se trouve dans « Afficher plus d’options ».
app.integration.finder_help:
  en: In Finder, use Open With → Castor, or drop files on the Castor icon in the Dock.
  fr: Dans le Finder, utilisez Ouvrir avec → Castor, ou déposez des fichiers sur l’icône de Castor dans le Dock.
app.watch.title:
  en: Watch folders
  fr: Dossiers surveillés
app.watch.help:
  en: "New files dropped in a watched folder go through a chain as soon as they finish copying; results land in its “%{dir}” sub-folder. Castor must be running (the tray icon is enough)."
  fr: "Les nouveaux fichiers déposés dans un dossier surveillé passent par une chaîne dès la fin de leur copie ; les résultats arrivent dans son sous-dossier « %{dir} ». Castor doit être lancé (l’icône de la barre des tâches suffit)."

app.tagline:
  en: Gnaws through your files. Free, offline, yours.
  fr: Ronge vos fichiers à votre place. Gratuit, hors ligne, à vous.
  de: "Nagt sich durch Ihre Dateien. Kostenlos, offline, Ihres."

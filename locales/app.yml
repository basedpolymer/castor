app.ws.prefill_help:
  en: "Pre-filled by option name: logo, color (first colour), accent (second), colors, signature. Results go to the output folder, in a sub-folder per tool and day."
  fr: "Pré-rempli selon le nom de l’option : logo, color (première couleur), accent (seconde), colors, signature. Les résultats vont dans le dossier de sortie, dans un sous-dossier par outil et par jour."
  de: "Vorbelegt nach Optionsname: logo, color (erste Farbe), accent (zweite), colors, signature. Ergebnisse landen im Ausgabeordner, in einem Unterordner pro Werkzeug und Tag."
  es: "Se rellena según el nombre de la opción: logo, color (primer color), accent (segundo), colors, signature. Los resultados van a la carpeta de salida, en una subcarpeta por herramienta y día."
  it: "Precompilato in base al nome dell'opzione: logo, color (primo colore), accent (secondo), colors, signature. I risultati vanno nella cartella di output, in una sottocartella per strumento e giorno."
  pt-BR: "Preenchido pelo nome da opção: logo, color (primeira cor), accent (segunda), colors, signature. Os resultados vão para a pasta de saída, em uma subpasta por ferramenta e dia."
  ja: "オプション名に応じて自動入力されます: logo、color(1色目)、accent(2色目)、colors、signature。結果は出力フォルダ内の、ツールと日付ごとのサブフォルダに保存されます。"
  zh-CN: "按选项名称预填：logo、color（第一种颜色）、accent（第二种）、colors、signature。结果保存在输出文件夹中，每个工具每天一个子文件夹。"
  ko: "옵션 이름에 따라 미리 채워집니다: logo, color(첫 번째 색), accent(두 번째), colors, signature. 결과는 출력 폴더 안의 도구별, 날짜별 하위 폴더에 저장됩니다."

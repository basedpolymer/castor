app.settings.models_help:
  en: Some tools need a model or a helper program. Castor fetches each one once, only after asking, then works offline.
  fr: Certains outils ont besoin d’un modèle ou d’un programme d’appoint. Castor récupère chacun une seule fois, seulement après accord, puis tout fonctionne hors ligne.
  de: "Manche Werkzeuge brauchen ein Modell oder ein Hilfsprogramm. Castor lädt jedes nur einmal und erst nach Rückfrage; danach läuft alles offline."
  es: "Algunas herramientas necesitan un modelo o un programa auxiliar. Castor descarga cada uno una sola vez, solo después de preguntar, y luego funciona sin conexión."
  it: "Alcuni strumenti richiedono un modello o un programma di supporto. Castor scarica ciascuno una volta sola, solo dopo averlo chiesto, poi funziona offline."
  pt-BR: "Algumas ferramentas precisam de um modelo ou de um programa auxiliar. O Castor baixa cada um uma única vez, só depois de perguntar, e depois funciona offline."
  ja: "一部のツールにはモデルや補助プログラムが必要です。Castorは確認したうえで、それぞれ一度だけ取得し、その後はオフラインで動作します。"
  zh-CN: "部分工具需要模型或辅助程序。Castor 会在征得你同意后各下载一次，之后即可离线使用。"
  ko: "일부 도구는 모델이나 보조 프로그램이 필요합니다. Castor는 먼저 물어본 뒤 각각 한 번만 내려받고, 이후에는 오프라인으로 작동합니다."

app.ws.help:
  en: A workspace keeps a brand (logo, two colours, a signature), an output folder and its own list of runs. Tools that take a logo, a colour or a signature start with the workspace’s.
  fr: Un espace de travail garde une identité (logo, deux couleurs, une signature), un dossier de sortie et sa propre liste d’exécutions. Les outils qui prennent un logo, une couleur ou une signature partent de ceux de l’espace.

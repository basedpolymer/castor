  pt-BR: "%{name} será substituído pela versão editada. Uma cópia do original é mantida: Execuções → Desfazer a restaura."
  ja: "%{name} は編集後のバージョンに置き換えられます。元のコピーは保持され、「実行履歴」→「元に戻す」で復元できます。"
  zh-CN: "%{name} 将被编辑后的版本替换。原文件的副本会保留：在“运行记录”中点击“撤销”即可恢复。"

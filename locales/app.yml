app.studio.media.name:
  en: Trim & Caption Studio
  fr: Studio montage et sous-titres
app.studio.media.desc:
  en: Cut a video or a recording on a timeline, remove the pauses, edit it by its transcript and add captions.
  fr: Coupez une vidéo ou un enregistrement sur une frise, retirez les blancs, montez-le par sa transcription et ajoutez des sous-titres.
app.studio.media.features:
  en: "Trim the start and end, cut out the middle, keyframe-fast or frame-exact. Find the pauses and remove them all at once. Transcribe with Whisper and delete words to cut them. Edit caption text and timing, then burn them in or save SRT."
  fr: "Rognez le début et la fin, coupez au milieu, rapide sur les images clés ou exact à l’image. Trouvez les blancs et retirez-les d’un coup. Transcrivez avec Whisper et supprimez des mots pour les couper. Corrigez le texte et le minutage des sous-titres, puis incrustez-les ou enregistrez un SRT."

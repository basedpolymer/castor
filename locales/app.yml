app.integration.quick_actions_help:
  en: Right-click files → Quick Actions → Open in Castor or one of your favourite tools. Kept in step with your favourites at each launch.
  fr: Clic droit sur des fichiers → Actions rapides → Ouvrir dans Castor ou l’un de vos outils favoris. Mis à jour avec vos favoris à chaque lancement.
  de: "Rechtsklick auf Dateien → Schnellaktionen → „In Castor öffnen“ oder eines Ihrer Lieblingswerkzeuge. Wird bei jedem Start an Ihre Favoriten angepasst."
  es: "Clic derecho en los archivos → Acciones rápidas → Abrir en Castor o una de tus herramientas favoritas. Se actualiza con tus favoritos en cada inicio."
  it: "Clic destro sui file → Azioni rapide → Apri in Castor o uno dei tuoi strumenti preferiti. Aggiornate con i tuoi preferiti a ogni avvio."
  pt-BR: "Clique com o botão direito nos arquivos → Ações Rápidas → Abrir no Castor ou uma de suas ferramentas favoritas. Atualizadas com seus favoritos a cada abertura."
  ja: "ファイルを右クリック → クイックアクション → 「Castorで開く」またはお気に入りのツール。起動のたびにお気に入りに合わせて更新されます。"
  zh-CN: "右键单击文件 → 快速操作 → “在 Castor 中打开”或你收藏的某个工具。每次启动时会按你的收藏更新。"
  ko: "파일을 마우스 오른쪽 버튼으로 클릭 → 빠른 동작 → ‘Castor에서 열기’ 또는 즐겨찾는 도구를 선택하세요. 실행할 때마다 즐겨찾기에 맞춰 갱신됩니다."

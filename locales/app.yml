app.media.exact.help:
  en: Cuts on the exact frame; the video is re-encoded at high quality.
  fr: Coupe à l’image près ; la vidéo est réencodée en haute qualité.
  de: "Schneidet auf das exakte Bild; das Video wird in hoher Qualität neu kodiert."
  es: "Corta en el fotograma exacto; el vídeo se recodifica en alta calidad."
  it: "Taglia sul fotogramma esatto; il video viene ricodificato ad alta qualità."
  pt-BR: "Corta no quadro exato; o vídeo é recodificado em alta qualidade."
  ja: "フレーム単位で正確にカットします。動画は高画質で再エンコードされます。"
  zh-CN: "精确剪切到具体帧；视频会以高质量重新编码。"
  ko: "정확한 프레임에서 자르며, 동영상은 고화질로 다시 인코딩됩니다."
app.media.fast.help:
  en: No re-encoding, nearly instant; cuts snap to the nearest keyframe.
  fr: Sans réencodage, presque instantané ; les coupes se calent sur l’image clé la plus proche.
  de: "Keine Neukodierung, fast sofort; Schnitte rasten am nächsten Keyframe ein."
  es: "Sin recodificar, casi instantáneo; los cortes se ajustan al fotograma clave más cercano."
  it: "Nessuna ricodifica, quasi istantaneo; i tagli si agganciano al keyframe più vicino."
  pt-BR: "Sem recodificação, quase instantâneo; os cortes se ajustam ao quadro-chave mais próximo."
  ja: "再エンコードなしでほぼ一瞬。カット位置は最も近いキーフレームに合わせられます。"

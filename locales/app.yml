app.settings.privacy_body:
  en: Castor works on this machine. Your files are never uploaded, there is no account and no analytics. The only connections are the update check (if on) and the one-time downloads you approve.
  fr: Castor travaille sur cet ordinateur. Vos fichiers ne sont jamais envoyés, il n’y a ni compte ni statistiques. Les seules connexions sont la recherche de mises à jour (si activée) et les téléchargements uniques que vous acceptez.
  de: "Castor arbeitet auf diesem Rechner. Ihre Dateien werden nie hochgeladen, es gibt kein Konto und keine Analyse-Tools. Verbindungen gibt es nur für die Update-Prüfung (falls aktiv) und die einmaligen Downloads, die Sie freigeben."
  es: "Castor trabaja en este equipo. Tus archivos nunca se suben, no hay cuenta ni analíticas. Las únicas conexiones son la búsqueda de actualizaciones (si está activada) y las descargas únicas que apruebes."
  it: "Castor lavora su questo computer. I tuoi file non vengono mai caricati, non c'è nessun account e nessuna analisi. Le uniche connessioni sono il controllo degli aggiornamenti (se attivo) e i download una tantum che approvi."
  pt-BR: "O Castor trabalha neste computador. Seus arquivos nunca são enviados, não há conta nem análises de uso. As únicas conexões são a verificação de atualizações (se ativada) e os downloads únicos que você aprovar."
  ja: "Castorはこのコンピューター上で動作します。ファイルがアップロードされることはなく、アカウントも利用状況の収集もありません。通信は、アップデートの確認(オンの場合)と、あなたが許可した初回のみのダウンロードだけです。"
  zh-CN: "Castor 在这台电脑上运行。你的文件绝不会被上传，没有账号，也没有数据统计。仅有的网络连接是检查更新（若已开启）和你批准的一次性下载。"
  ko: "Castor는 이 컴퓨터에서 작동합니다. 파일은 절대 업로드되지 않고, 계정도 분석 도구도 없습니다. 연결은 업데이트 확인(켜 둔 경우)과 직접 승인한 1회성 다운로드뿐입니다."

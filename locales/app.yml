app.media.transcript.help:
  en: Words are clickable. Select some (click, then Shift-click) and cut them; the matching sound and picture go too.
  fr: Les mots sont cliquables. Sélectionnez-en (clic, puis Maj-clic) et coupez-les ; le son et l’image correspondants partent avec.
  de: "Wörter sind anklickbar. Wählen Sie welche aus (Klick, dann Umschalt-Klick) und schneiden Sie sie heraus; Ton und Bild verschwinden mit."
  es: "Las palabras se pueden pulsar. Selecciona algunas (clic y luego Mayús+clic) y córtalas; el sonido y la imagen correspondientes se van con ellas."
  it: "Le parole sono cliccabili. Selezionane alcune (clic, poi Maiusc+clic) e tagliale; spariscono anche l'audio e l'immagine corrispondenti."
  pt-BR: "As palavras são clicáveis. Selecione algumas (clique e depois Shift+clique) e corte-as; o som e a imagem correspondentes também saem."
  ja: "単語はクリックできます。クリックしてからShift+クリックで複数選択し、カットすると、対応する音声と映像も取り除かれます。"
  zh-CN: "文字可以点击。选中若干词（点击后按 Shift 点击）并剪掉，对应的声音和画面也会一并删除。"
  ko: "단어를 클릭할 수 있습니다. 클릭한 뒤 Shift+클릭으로 여러 개를 선택해 자르면 해당하는 소리와 화면도 함께 사라집니다."

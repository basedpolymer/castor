app.pdf.redact.note:
  en: Saving removes the text, images and drawings under each box for good, then checks that nothing readable is left.
  fr: L’enregistrement supprime pour de bon le texte, les images et les tracés sous chaque cadre, puis vérifie que plus rien n’est lisible.
  de: "Beim Speichern werden Text, Bilder und Zeichnungen unter jedem Rahmen endgültig entfernt; danach wird geprüft, dass nichts Lesbares übrig bleibt."
  es: "Al guardar se eliminan para siempre el texto, las imágenes y los dibujos bajo cada recuadro, y se comprueba que no quede nada legible."
  it: "Il salvataggio rimuove per sempre testo, immagini e disegni sotto ogni riquadro, poi verifica che non resti nulla di leggibile."
  pt-BR: "Ao salvar, o texto, as imagens e os desenhos sob cada caixa são removidos de vez, e então se verifica que nada legível sobrou."
  ja: "保存すると、各範囲の下にあるテキスト、画像、図形が完全に削除され、読み取れるものが残っていないか確認されます。"
  zh-CN: "保存时会彻底删除每个方框下的文字、图片和图形，并检查是否还有可读内容残留。"
  ko: "저장하면 각 상자 아래의 텍스트, 이미지, 그림이 완전히 삭제되고, 읽을 수 있는 내용이 남아 있지 않은지 확인합니다."


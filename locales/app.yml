app.media.trim.help:
  en: Click the timeline to move the playhead, drag across it to select a range. I and O set the start and the end, Delete cuts the selection.
  fr: Cliquez sur la frise pour déplacer la tête de lecture, glissez pour sélectionner une plage. I et O fixent le début et la fin, Suppr coupe la sélection.
  de: "Klicken Sie auf die Zeitleiste, um den Abspielkopf zu setzen, und ziehen Sie darüber, um einen Bereich zu wählen. I und O setzen Anfang und Ende, Entf schneidet die Auswahl heraus."
  es: "Haz clic en la línea de tiempo para mover el cabezal y arrastra para seleccionar un rango. I y O fijan el inicio y el final; Supr corta la selección."
  it: "Fai clic sulla timeline per spostare la testina e trascina per selezionare un intervallo. I e O impostano inizio e fine, Canc taglia la selezione."
  pt-BR: "Clique na linha do tempo para mover o cursor e arraste para selecionar um intervalo. I e O definem o início e o fim; Delete corta a seleção."
  ja: "タイムラインをクリックして再生位置を動かし、ドラッグして範囲を選択します。Iで開始、Oで終了を設定し、Deleteで選択範囲をカットします。"
  zh-CN: "点击时间轴可移动播放头，拖动可选择一段范围。按 I 和 O 设置起点和终点，按 Delete 剪掉所选部分。"
  ko: "타임라인을 클릭해 재생 헤드를 옮기고, 끌어서 구간을 선택하세요. I와 O로 시작과 끝을 정하고, Delete로 선택 구간을 잘라 냅니다."

app.studio.media.desc:
  en: Cut a video or a recording on a timeline, remove the pauses, edit it by its transcript and add captions.
  fr: Coupez une vidéo ou un enregistrement sur une frise, retirez les blancs, montez-le par sa transcription et ajoutez des sous-titres.
  de: "Schneiden Sie ein Video oder eine Aufnahme auf einer Zeitleiste, entfernen Sie die Pausen, bearbeiten Sie per Transkript und fügen Sie Untertitel hinzu."
  es: "Corta un vídeo o una grabación en una línea de tiempo, elimina las pausas, edítalo con su transcripción y añade subtítulos."
  it: "Taglia un video o una registrazione su una timeline, rimuovi le pause, modificalo dalla trascrizione e aggiungi i sottotitoli."
  pt-BR: "Corte um vídeo ou uma gravação em uma linha do tempo, remova as pausas, edite pela transcrição e adicione legendas."
  ja: "タイムライン上で動画や録音をカットし、無音部分を取り除き、文字起こしから編集して、字幕を追加できます。"
  zh-CN: "在时间轴上剪辑视频或录音，去除停顿，通过文字稿编辑，并添加字幕。"
  ko: "타임라인에서 동영상이나 녹음을 자르고, 말 사이 공백을 없애고, 대본으로 편집하고, 자막을 넣습니다."
app.studio.media.features:
  en: "Trim the start and end, cut out the middle, keyframe-fast or frame-exact. Find the pauses and remove them all at once. Transcribe with Whisper and delete words to cut them. Edit caption text and timing, then burn them in or save SRT."
  fr: "Rognez le début et la fin, coupez au milieu, rapide sur les images clés ou exact à l’image. Trouvez les blancs et retirez-les d’un coup. Transcrivez avec Whisper et supprimez des mots pour les couper. Corrigez le texte et le minutage des sous-titres, puis incrustez-les ou enregistrez un SRT."
  de: "Anfang und Ende kürzen, die Mitte herausschneiden, keyframe-schnell oder bildgenau. Pausen finden und alle auf einmal entfernen. Mit Whisper transkribieren und Wörter löschen, um sie zu schneiden. Untertiteltext und Timing bearbeiten, dann einbrennen oder als SRT speichern."
  es: "Recorta el inicio y el final, corta el centro, rápido por fotogramas clave o exacto al fotograma. Encuentra las pausas y elimínalas todas a la vez. Transcribe con Whisper y borra palabras para cortarlas. Edita el texto y los tiempos de los subtítulos, y luego incrústalos o guarda un SRT."
  it: "Taglia inizio e fine, ritaglia la parte centrale, veloce sui keyframe o preciso al fotogramma. Trova le pause e rimuovile tutte insieme. Trascrivi con Whisper e cancella le parole per tagliarle. Modifica testo e tempi dei sottotitoli, poi incorporali o salva un SRT."
  pt-BR: "Corte o início e o fim, recorte o meio, rápido por quadros-chave ou exato ao quadro. Encontre as pausas e remova todas de uma vez. Transcreva com o Whisper e apague palavras para cortá-las. Edite o texto e o tempo das legendas e depois grave-as no vídeo ou salve um SRT."
  ja: "先頭と末尾のトリミング、中間部分のカットを、キーフレーム単位の高速モードまたはフレーム単位の正確モードで。無音部分をまとめて検出して削除。Whisperで文字起こしし、単語を削除してカット。字幕のテキストとタイミングを編集し、焼き込みまたはSRTで保存。"
  zh-CN: "裁剪开头和结尾，剪掉中间部分，可选关键帧级快速模式或逐帧精确模式。查找停顿并一次性全部删除。用 Whisper 转写，删除文字即可剪掉对应片段。编辑字幕文本和时间，然后烧录进视频或保存为 SRT。"
  ko: "시작과 끝을 다듬고 중간을 잘라 냅니다. 키프레임 단위의 빠른 모드나 프레임 단위의 정확한 모드를 쓸 수 있습니다. 공백을 찾아 한꺼번에 제거하고, Whisper로 받아쓴 뒤 단어를 지워 잘라 냅니다. 자막 텍스트와 타이밍을 편집한 다음 영상에 입히거나 SRT로 저장합니다."

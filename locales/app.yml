app.pdf.redact.help:
  en: Drag boxes over what must disappear, or find text to mark every occurrence. Nothing is removed until you save.
  fr: Tracez des cadres sur ce qui doit disparaître, ou cherchez un texte pour en marquer chaque occurrence. Rien n’est supprimé avant l’enregistrement.
  de: "Ziehen Sie Rahmen über alles, was verschwinden soll, oder suchen Sie Text, um jedes Vorkommen zu markieren. Erst beim Speichern wird etwas entfernt."
  es: "Arrastra recuadros sobre lo que debe desaparecer, o busca texto para marcar cada aparición. Nada se elimina hasta que guardes."
  it: "Trascina riquadri su ciò che deve sparire, oppure cerca un testo per segnare ogni occorrenza. Non viene rimosso nulla finché non salvi."
  pt-BR: "Arraste caixas sobre o que deve desaparecer ou procure um texto para marcar cada ocorrência. Nada é removido até você salvar."
  ja: "消したい部分の上をドラッグして範囲を指定するか、テキストを検索してすべての該当箇所に印を付けます。保存するまで何も削除されません。"
  zh-CN: "在需要消失的内容上拖出方框，或查找文字以标记每一处。保存之前不会删除任何内容。"
  ko: "지울 내용 위에 상자를 끌거나 텍스트를 찾아 모든 일치 항목을 표시하세요. 저장하기 전에는 아무것도 삭제되지 않습니다."


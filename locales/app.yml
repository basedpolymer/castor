app.integration.explorer_help:
  en: Right-click files → Castor → Open in Castor or one of your favourite tools. On Windows 11 it is under “Show more options”.
  fr: Clic droit sur des fichiers → Castor → Ouvrir dans Castor ou l’un de vos outils favoris. Sous Windows 11, il se trouve dans « Afficher plus d’options ».
  de: "Rechtsklick auf Dateien → Castor → „In Castor öffnen“ oder eines Ihrer Lieblingswerkzeuge. Unter Windows 11 finden Sie es unter „Weitere Optionen anzeigen“."
  es: "Clic derecho en los archivos → Castor → Abrir en Castor o una de tus herramientas favoritas. En Windows 11 está en “Mostrar más opciones”."
  it: "Clic destro sui file → Castor → Apri in Castor o uno dei tuoi strumenti preferiti. In Windows 11 si trova sotto «Mostra altre opzioni»."
  pt-BR: "Clique com o botão direito nos arquivos → Castor → Abrir no Castor ou uma de suas ferramentas favoritas. No Windows 11, fica em “Mostrar mais opções”."
  ja: "ファイルを右クリック → Castor → 「Castorで開く」またはお気に入りのツール。Windows 11では「その他のオプションを確認」の中にあります。"
  zh-CN: "右键单击文件 → Castor → “在 Castor 中打开”或你收藏的某个工具。在 Windows 11 中，它位于“显示更多选项”下。"
  ko: "파일을 마우스 오른쪽 버튼으로 클릭 → Castor → ‘Castor에서 열기’ 또는 즐겨찾는 도구를 선택하세요. Windows 11에서는 ‘더 많은 옵션 표시’ 안에 있습니다."
app.integration.finder_help:
  en: In Finder, use Open With → Castor, or drop files on the Castor icon in the Dock.
  fr: Dans le Finder, utilisez Ouvrir avec → Castor, ou déposez des fichiers sur l’icône de Castor dans le Dock.
  de: "Verwenden Sie im Finder „Öffnen mit“ → Castor oder ziehen Sie Dateien auf das Castor-Symbol im Dock."
  es: "En el Finder, usa Abrir con → Castor, o suelta archivos sobre el icono de Castor en el Dock."
  it: "Nel Finder usa Apri con → Castor, oppure trascina i file sull'icona di Castor nel Dock."
  pt-BR: "No Finder, use Abrir com → Castor, ou solte arquivos no ícone do Castor no Dock."
  ja: "Finderでは「このアプリケーションで開く」→ Castor を選ぶか、ファイルをDockのCastorアイコンにドロップしてください。"
  zh-CN: "在访达中使用“打开方式”→ Castor，或将文件拖到程序坞中的 Castor 图标上。"
  ko: "Finder에서 ‘다음으로 열기’ → Castor를 사용하거나 파일을 Dock의 Castor 아이콘에 끌어다 놓으세요."
app.watch.title:
  en: Watch folders
  fr: Dossiers surveillés
  de: "Überwachte Ordner"
  es: "Carpetas vigiladas"
  it: "Cartelle monitorate"
  pt-BR: "Pastas monitoradas"
  ja: "監視フォルダ"
  zh-CN: "监视文件夹"
  ko: "감시 폴더"
app.watch.help:
  en: "New files dropped in a watched folder go through a chain as soon as they finish copying; results land in its “%{dir}” sub-folder. Castor must be running (the tray icon is enough)."
  fr: "Les nouveaux fichiers déposés dans un dossier surveillé passent par une chaîne dès la fin de leur copie ; les résultats arrivent dans son sous-dossier « %{dir} ». Castor doit être lancé (l’icône de la barre des tâches suffit)."
  de: "Neue Dateien in einem überwachten Ordner durchlaufen eine Kette, sobald sie fertig kopiert sind; die Ergebnisse landen im Unterordner „%{dir}“. Castor muss laufen (das Symbol im Infobereich genügt)."
  es: "Los archivos nuevos que lleguen a una carpeta vigilada pasan por una cadena en cuanto terminan de copiarse; los resultados van a su subcarpeta “%{dir}”. Castor debe estar en ejecución (basta con el icono de la bandeja)."
  it: "I nuovi file che finiscono in una cartella monitorata passano per una catena appena finiscono di essere copiati; i risultati vanno nella sua sottocartella «%{dir}». Castor deve essere in esecuzione (basta l'icona nell'area di notifica)."
  pt-BR: "Os novos arquivos colocados em uma pasta monitorada passam por uma cadeia assim que terminam de ser copiados; os resultados vão para a subpasta “%{dir}”. O Castor precisa estar em execução (o ícone na bandeja basta)."
  ja: "監視フォルダに追加された新しいファイルは、コピーが完了すると同時にチェーンで処理され、結果はサブフォルダ「%{dir}」に保存されます。Castorを起動しておく必要があります(トレイアイコンだけでも構いません)。"
  zh-CN: "放入监视文件夹的新文件在复制完成后会立即经过一条链处理，结果保存到其“%{dir}”子文件夹。Castor 必须保持运行（仅保留托盘图标即可）。"
  ko: "감시 폴더에 새로 들어온 파일은 복사가 끝나는 즉시 체인으로 처리되며, 결과는 하위 폴더 “%{dir}”에 저장됩니다. Castor가 실행 중이어야 합니다(트레이 아이콘만 있어도 됩니다)."

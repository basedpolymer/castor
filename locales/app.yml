app.studio.pdf.desc:
  en: Open one PDF and work on its pages directly — reorder, annotate, sign, black out, fill in.
  fr: Ouvrez un PDF et travaillez directement sur ses pages — réordonner, annoter, signer, caviarder, remplir.
  de: "Öffnen Sie ein PDF und bearbeiten Sie die Seiten direkt: neu ordnen, kommentieren, signieren, schwärzen, ausfüllen."
  es: "Abre un PDF y trabaja sus páginas directamente: reordena, anota, firma, censura, rellena."
  it: "Apri un PDF e lavora direttamente sulle sue pagine: riordina, annota, firma, oscura, compila."
  pt-BR: "Abra um PDF e trabalhe nas páginas diretamente: reordene, anote, assine, tarje, preencha."
  ja: "PDFを1つ開き、ページを直接編集できます。並べ替え、注釈、署名、墨消し、入力に対応。"
  zh-CN: "打开一个 PDF，直接处理其页面：重新排序、批注、签名、涂黑、填写。"
  ko: "PDF 하나를 열어 페이지를 직접 편집하세요. 순서 변경, 주석, 서명, 가림 처리, 양식 작성이 가능합니다."

app.studio.pdf.features:
  en: "Organize: drag pages, rotate, delete, insert from another PDF, extract a selection. Annotate: highlight, underline, pen, boxes, arrows, text, comments. Sign: draw, type or import a signature. Redact: boxes or found text, truly removed on save. Forms: type into the fields."
  fr: "Organiser : glisser les pages, pivoter, supprimer, insérer depuis un autre PDF, extraire une sélection. Annoter : surligner, souligner, stylo, cadres, flèches, texte, commentaires. Signer : dessiner, taper ou importer une signature. Caviarder : cadres ou texte trouvé, vraiment supprimés à l’enregistrement. Formulaires : saisir dans les champs."
  de: "Organisieren: Seiten ziehen, drehen, löschen, aus einem anderen PDF einfügen, eine Auswahl extrahieren. Kommentieren: markieren, unterstreichen, Stift, Rahmen, Pfeile, Text, Kommentare. Signieren: Unterschrift zeichnen, tippen oder importieren. Schwärzen: Rahmen oder gefundener Text, beim Speichern wirklich entfernt. Formulare: in die Felder tippen."
  es: "Organizar: arrastrar páginas, girar, eliminar, insertar desde otro PDF, extraer una selección. Anotar: resaltar, subrayar, lápiz, recuadros, flechas, texto, comentarios. Firmar: dibujar, escribir o importar una firma. Censurar: recuadros o texto encontrado, eliminado de verdad al guardar. Formularios: escribir en los campos."
  it: "Organizza: trascina le pagine, ruota, elimina, inserisci da un altro PDF, estrai una selezione. Annota: evidenzia, sottolinea, penna, riquadri, frecce, testo, commenti. Firma: disegna, digita o importa una firma. Oscura: riquadri o testo trovato, rimosso davvero al salvataggio. Moduli: scrivi nei campi."
  pt-BR: "Organizar: arrastar páginas, girar, excluir, inserir de outro PDF, extrair uma seleção. Anotar: realçar, sublinhar, caneta, caixas, setas, texto, comentários. Assinar: desenhar, digitar ou importar uma assinatura. Tarjar: caixas ou texto encontrado, removido de verdade ao salvar. Formulários: digitar nos campos."
  ja: "整理: ページのドラッグ、回転、削除、別のPDFからの挿入、選択範囲の抽出。注釈: ハイライト、下線、ペン、四角、矢印、テキスト、コメント。署名: 手書き、入力、画像の取り込み。墨消し: 範囲指定または検索したテキストを、保存時に完全に削除。フォーム: 入力欄に直接入力。"
  zh-CN: "整理：拖动、旋转、删除页面，从其他 PDF 插入，提取所选页面。批注：高亮、下划线、画笔、方框、箭头、文字、评论。签名：手绘、键入或导入签名。涂黑：用方框或查找到的文字，保存时彻底删除。表单：直接在字段中输入。"
  ko: "정리: 페이지 끌기, 회전, 삭제, 다른 PDF에서 삽입, 선택 영역 추출. 주석: 형광펜, 밑줄, 펜, 상자, 화살표, 텍스트, 코멘트. 서명: 그리기, 입력 또는 가져오기. 가림 처리: 상자 또는 찾은 텍스트를 저장할 때 완전히 삭제. 양식: 필드에 직접 입력."


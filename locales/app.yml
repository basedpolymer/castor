app.studio.unavailable:
  en: Studios need the engines of the full build; this development build has only demo tools.
  fr: Les studios ont besoin des moteurs de la version complète ; cette version de développement n’a que des outils de démonstration.
  de: "Studios benötigen die Engines der Vollversion; diese Entwicklungsversion enthält nur Demo-Werkzeuge."
  es: "Los estudios necesitan los motores de la versión completa; esta versión de desarrollo solo tiene herramientas de demostración."
  it: "Gli studio richiedono i motori della versione completa; questa build di sviluppo contiene solo strumenti dimostrativi."
  pt-BR: "Os estúdios precisam dos mecanismos da versão completa; esta versão de desenvolvimento só tem ferramentas de demonstração."
  ja: "スタジオにはフル版のエンジンが必要です。この開発ビルドにはデモ用ツールしかありません。"
  zh-CN: "工作室需要完整版的引擎；此开发版本只包含演示工具。"
  ko: "스튜디오는 정식 빌드의 엔진이 필요합니다. 이 개발 빌드에는 데모 도구만 있습니다."

app.studio.footer:
  en: Studios never touch the original unless you ask, and every save is listed in Runs, where an overwrite can be undone.
  fr: Les studios ne touchent jamais à l’original sans votre accord, et chaque enregistrement figure dans Historique, d’où un écrasement peut être annulé.
  de: "Studios berühren das Original nie, außer Sie wünschen es. Jede Speicherung steht unter „Läufe“, wo sich ein Überschreiben rückgängig machen lässt."
  es: "Los estudios nunca tocan el original salvo que lo pidas, y cada guardado aparece en Ejecuciones, donde se puede deshacer una sobrescritura."
  it: "Gli studio non toccano mai l'originale se non lo chiedi, e ogni salvataggio compare in Esecuzioni, dove una sovrascrittura si può annullare."
  pt-BR: "Os estúdios nunca mexem no original, a menos que você peça, e cada salvamento aparece em Execuções, onde uma substituição pode ser desfeita."
  ja: "スタジオは、指示しない限り元のファイルには触れません。保存はすべて「実行履歴」に記録され、上書きは取り消せます。"
  zh-CN: "除非你要求，工作室绝不会改动原文件；每次保存都会列在“运行记录”中，覆盖操作可以在那里撤销。"
  ko: "스튜디오는 요청하지 않는 한 원본을 건드리지 않으며, 저장할 때마다 '실행 기록'에 남아 덮어쓰기를 되돌릴 수 있습니다."

app.studio.err.undo:
  en: The saved copy of the original is gone, so this cannot be undone.
  fr: "La copie de l’original a disparu : impossible d’annuler."
  de: "Die gespeicherte Kopie des Originals ist nicht mehr vorhanden, daher lässt sich das nicht rückgängig machen."
  es: "La copia guardada del original ya no existe, así que no se puede deshacer."
  it: "La copia salvata dell'originale non esiste più, quindi non è possibile annullare."
  pt-BR: "A cópia salva do original não existe mais, então não é possível desfazer."
  ja: "元のファイルのバックアップコピーがないため、取り消せません。"
  zh-CN: "原文件的已保存副本已不存在，因此无法撤销。"
  ko: "원본의 저장된 사본이 없어져서 되돌릴 수 없습니다."


app.ws.help:
  en: A workspace keeps a brand (logo, two colours, a signature), an output folder and its own list of runs. Tools that take a logo, a colour or a signature start with the workspace’s.
  fr: Un espace de travail garde une identité (logo, deux couleurs, une signature), un dossier de sortie et sa propre liste d’exécutions. Les outils qui prennent un logo, une couleur ou une signature partent de ceux de l’espace.
  de: "Ein Arbeitsbereich bewahrt eine Marke (Logo, zwei Farben, eine Signatur), einen Ausgabeordner und eine eigene Liste von Läufen. Werkzeuge mit Logo, Farbe oder Signatur starten mit den Werten des Arbeitsbereichs."
  es: "Un espacio de trabajo guarda una marca (logotipo, dos colores, una firma), una carpeta de salida y su propia lista de ejecuciones. Las herramientas que usan logotipo, color o firma empiezan con los del espacio de trabajo."
  it: "Uno spazio di lavoro conserva un marchio (logo, due colori, una firma), una cartella di output e un proprio elenco di esecuzioni. Gli strumenti che usano un logo, un colore o una firma partono con quelli dello spazio di lavoro."
  pt-BR: "Um espaço de trabalho guarda uma marca (logotipo, duas cores, uma assinatura), uma pasta de saída e a sua própria lista de execuções. As ferramentas que usam logotipo, cor ou assinatura começam com os do espaço de trabalho."
  ja: "ワークスペースには、ブランド(ロゴ、2色、署名)、出力フォルダ、専用の実行履歴が保存されます。ロゴ、色、署名を使うツールは、ワークスペースの設定を初期値にして始まります。"
  zh-CN: "工作区会保存一套品牌信息（标志、两种颜色、一个签名）、一个输出文件夹，以及独立的运行记录。需要标志、颜色或签名的工具会默认使用当前工作区的设置。"
  ko: "워크스페이스에는 브랜드(로고, 색상 두 가지, 서명), 출력 폴더, 별도의 실행 기록이 저장됩니다. 로고, 색상, 서명을 쓰는 도구는 워크스페이스의 값으로 시작합니다."

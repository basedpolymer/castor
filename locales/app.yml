  de: "Höchstens einmal täglich, über GitHub. Es werden keine Daten über Sie gesendet."
  es: "Como máximo una vez al día, en GitHub. No se envía nada sobre ti."
  it: "Al massimo una volta al giorno, su GitHub. Non viene inviato nulla su di te."
  pt-BR: "No máximo uma vez por dia, no GitHub. Nada sobre você é enviado."
  ja: "確認は1日1回までで、GitHubに対して行います。あなたに関する情報は送信されません。"
  zh-CN: "每天最多一次，通过 GitHub 检查。不会发送任何关于你的信息。"
  ko: "하루에 최대 한 번, GitHub에서 확인합니다. 사용자에 관한 정보는 전송되지 않습니다."
